# Build, test, and release-verify the Forge Python tool.
id: forge-tool
kind: tool
watch:
  - .github/workflows/scpf.yml
  - scpf/scpf/**
  - scpf/tests/**
  - scpf/pyproject.toml
  - scripts/tool_ci.py
  - scripts/tool_verify.py
  - scripts/forge_example.py
  - examples/simple-box/scpf/**
  - examples/simple-box/tests/**
  - examples/anchored-holes/scpf/**
  - examples/anchored-holes/tests/**
  - examples/components/scpf/**
  - examples/components/tests/**
  - examples/corner-anchor/scpf/**
  - examples/corner-anchor/tests/**
  - examples/custom-anchor/scpf/**
strategy:
  reuse: true
steps:
  - id: tool_build
    inputs:
      - scpf/scpf/**
      - scpf/pyproject.toml
      - scripts/tool_ci.py
    run: [python, ../scripts/tool_ci.py, tool_build]
    outputs: [dist]

  - id: tool_test
    inputs:
      - scpf/scpf/**
      - scpf/tests/**
      - scpf/pyproject.toml
      - scripts/tool_ci.py
    run: [python, ../scripts/tool_ci.py, tool_test]

  - id: tool_verify
    inputs:
      - scripts/tool_verify.py
      - scripts/forge_example.py
      - examples/simple-box/scpf/**
      - examples/simple-box/tests/**
      - examples/anchored-holes/scpf/**
      - examples/anchored-holes/tests/**
      - examples/components/scpf/**
      - examples/components/tests/**
      - examples/corner-anchor/scpf/**
      - examples/corner-anchor/tests/**
      - examples/custom-anchor/scpf/**
    run: [python, ../scripts/tool_verify.py]
    outputs: [tool_verify]
