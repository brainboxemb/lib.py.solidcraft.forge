# Build the exact Forge Python package consumed by downstream CI items.
id: forge-package
kind: tool
watch:
  - scpf/scpf/**
  - scpf/pyproject.toml
  - scripts/tool_ci.py
strategy:
  reuse: true
steps:
  - id: tool_build
    inputs:
      - scpf/scpf/**
      - scpf/pyproject.toml
      - scripts/tool_ci.py
    run: [python, ../scripts/tool_ci.py, tool_build]
    outputs: [dist]
