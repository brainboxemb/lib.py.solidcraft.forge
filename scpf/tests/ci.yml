# The Forge library unit-test layer. This item proves public API, validation,
# compiler and shared geometry rules without native SolidCraft.
id: library-tests
kind: library-test
watch:
  - scpf/scpf/**
  - scpf/tests/**
  - scpf/pyproject.toml
strategy:
  reuse: true
steps:
  - id: test
    run: [python, -m, unittest, discover, -s, ., -p, "test_*.py", -v]
