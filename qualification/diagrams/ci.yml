# Qualification diagrams are generated presentation evidence with their own
# inputs and output path. They do not belong to any one modelling example.
id: qualification-diagrams
kind: evidence
watch:
  - qualification/diagrams/**
  - qualification/render_diagrams.py
  - qualification/render_cadcraft_diagram.sh
  - docker/qualification/**
  - scripts/qualification_evidence_ci.py
strategy:
  reuse: true
steps:
  - id: build
    run: [python, ../../scripts/qualification_evidence_ci.py, diagrams]
    outputs: [rendered]
