schema: 1
id: sample-plate-drawing
process: true
primary: scpf

implementations:
  - id: scpf
    builder: builder-scpf
    source: scpf/model.py
    preview: false

verifications:
  - id: native
    module: verification
    adapter: solidcraft-model
    definition: verification/solidcraft.py
    artifact: model.sc
    implementations: [scpf]

  - id: drawing-sheet
    module: verification
    adapter: image-regression
    definition: verification/drawing_visual.json
    artifact: drawings/Sample-Plate-Drawing.png
    implementations: [scpf]

  - id: compact-drawing-sheet
    module: verification
    adapter: image-regression
    definition: verification/compact_drawing_visual.json
    artifact: drawings/Compact-Sample-Plate-Drawing.png
    implementations: [scpf]

dependencies: []
needs: [cadlib]
