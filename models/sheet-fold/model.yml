schema: 1
purpose: verification
section: sheet-metal
priority: 10
title: Parametric flat sheet, through hole and 90° fold
tagline: Native sheet-metal history with an associative Sketch fold line
description: >
  An 80 × 40 mm flat sheet blank with one through hole and one 90 degree native
  fold using a shared sheet rule. The bend line is a native Sketch line whose
  endpoints depend on the editable depth parameter, so changing depth after
  saving extends the fold line and rebuilds the sheet.
parameters: 80 × 40 × 2 mm sheet; R2 bend, K=0.5, 90° fold, Ø6 hole
stages:
  - Create the parameterized flat rectangular Blank sketch
  - Create native sheet material and cut the Ø6 hole while flat
  - Author a separate Fold line Sketch whose endpoints follow depth
  - Fold the sheet 90 degrees through the native Sketch/curve reference
  - Change depth in the saved design and require the fold to rebuild cleanly
