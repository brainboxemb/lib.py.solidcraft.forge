schema: 1
id: round-top-sketch
process: true
primary: scpf

implementations:
  - id: scpf
    builder: builder-scpf
    source: scpf/model.py
    preview: false
  - id: cadquery
    builder: builder-cadquery
    source: cadquery/model.py
  - id: build123d
    builder: builder-build123d
    source: build123d/model.py
  - id: pythonscad
    builder: builder-pythonscad
    source: pythonscad/model.py
  - id: pybosl2
    builder: builder-pybosl2
    source: pybosl2/model.py

verifications:
  - id: native
    module: verification
    adapter: solidcraft-model
    definition: verification/solidcraft.py
    artifact: model.sc
    implementations: [scpf]
  - id: geometry
    module: verification
    adapter: mesh-geometry
    definition: verification/geometry.json
    artifact: model.stl

preview:
  module: preview
  adapter: mesh

dependencies: []
needs: [cadlib]
