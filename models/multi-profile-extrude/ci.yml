schema: 1
id: multi-profile-extrude
process: true
primary: scpf

implementations:
  - id: scpf
    builder: builder-scpf
    source: scpf/model.py
    preview: false

verifications:
  - id: native
    module: verification
    adapter: solidcraft-model
    definition: verification/solidcraft.py
    artifact: model.sc
    implementations: [scpf]
  - id: geometry
    module: verification
    adapter: mesh-geometry
    definition: verification/geometry.json
    artifact: model.stl
    implementations: [scpf]

dependencies: []
needs: [cadlib]
