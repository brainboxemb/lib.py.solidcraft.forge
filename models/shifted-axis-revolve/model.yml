section: configurations
priority: 50
title: Shifted-axis Revolve
tagline: One stepped offset revolve cut remains one native suppressible feature
description: >
  A stepped radial profile is revolved 360 degrees around a Y-axis shifted to
  a parameter-driven X/Z location, then applied as one cut to a panel. A native
  configuration row suppresses that exact revolve feature as one unit.
parameters: axis x=8 mm; axis z=3 mm; relief Ø4.5 mm; core Ø3.7 mm
stages:
  - Author a parameter-driven XY profile on the axis Z plane
  - Revolve around one typed AxisLine parallel to world Y
  - Apply the complete stepped pass-through as one native cut feature
  - Switch the saved configuration to suppress and restore that exact feature
