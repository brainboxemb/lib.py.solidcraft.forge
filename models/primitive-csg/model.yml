title: Primitive CSG
tagline: Direct primitives and Boolean operators form one native CSG result
description: >
  Sphere, Box and X-axis Cylinder primitives are translated into one typed Boolean history. The final clipping Box remains an exact authored feature so the SCPF implementation can qualify semantic suppression without backend feature ids.
parameters: Sphere R20; 30 mm Box extension; Ø8 X-axis bore; 50 mm clipping Box
stages:
  - Create and union the Sphere and translated Box
  - Subtract the centered X-axis Cylinder bore
  - Intersect the result with the clipping Box
  - Keep Clipped as the active configuration and qualify suppressing/restoring that exact final feature
