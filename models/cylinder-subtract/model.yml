schema: 1
purpose: verification
section: features
priority: 96
title: Primitive placement semantic IR
tagline: One off-centre Cylinder cut proves shared Forge placement intent across native backends
description: >
  A bottom-anchored rectangular body is cut by an off-centre Z-axis Cylinder.
  Forge evaluates the SCPF source once, separates primitive geometry from
  PlacementIR, combines those placed primitives in BooleanSubtractIR, and
  lowers the same semantic intent independently to SolidCraft and Mitcad.
parameters: 60 × 40 × 12 mm Box; Ø10 mm through bore at X=8, Y=-5
stages:
  - Create typed BoxIR and CylinderIR primitive geometry
  - Place both through shared PlacementIR point and anchor semantics
  - Normalize subtraction to BooleanSubtractIR
  - Lower the same placed boolean to SolidCraft and Mitcad native cut operations
