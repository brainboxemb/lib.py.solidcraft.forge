schema: 1
id: configuration-position
process: true
primary: scpf

implementations:
  - id: scpf
    builder: builder-scpf
    source: scpf/model.py
    preview: false

verifications:
  - id: native
    module: verification
    adapter: solidcraft-model
    definition: verification/solidcraft.py
    artifact: model.sc
    implementations: [scpf]

  - id: visual-front
    module: verification
    adapter: solidcraft-visual
    definition: verification/visual-front.json
    artifact: model.sc
    implementations: [scpf]

  - id: visual-service
    module: verification
    adapter: solidcraft-visual
    definition: verification/visual-service.json
    artifact: model.sc
    implementations: [scpf]

dependencies: []
needs: [cadlib]
