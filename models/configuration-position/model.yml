title: Configuration Position
tagline: One saved native table moves a front-plate occurrence through Front, Below and Service states
description: >
  This case proves that one complete assembly can keep a fixed screen while a
  separate front-plate occurrence follows two native Placement parameters.
  Reopening the saved design and activating Front, Below or Service moves only
  that occurrence without rebuilding the Python assembly.
parameters: Front y=8 z=0; Below y=0 z=-55; Service y=25 z=0
stages:
  - Build screen and front-plate component occurrences
  - Keep front-plate Y and Z placement associative to model parameters
  - Author one native configuration table around the complete assembly
  - Switch to Below and Service in the saved SolidCraft design
