title: Independent Installed state
tagline: Small / Medium / Large stays independent from the native Installed rule
description: >
  A reusable split flexible sleeve keeps Small / Medium / Large as the ordinary
  configuration-row axis. Native SolidCraft rule evidence proves an independent
  Installed state can drive the shared fit parameter without replacing those
  rows; disabling the rule restores the active row's Free expression.
parameters: Tube 20.0 mm; Free interference 0.2 mm; sizes 20/30/40 mm
stages:
  - Build one reusable split flexible-fit child component
  - Keep Small / Medium / Large as ordinary configuration rows
  - Enable Installed as a native rule that drives the shared fit parameter
  - Switch to Large while Installed remains active
  - Disable Installed and prove Large remains active while Free fit returns
