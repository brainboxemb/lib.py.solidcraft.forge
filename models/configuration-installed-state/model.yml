title: Free / Installed state
tagline: One flexible-fit component keeps manufacturing and mounted geometry as native configuration rows
description: >
  A split flexible sleeve is slightly oversized in its Free manufacturing
  state and compressed to its Installed working diameter after mounting.
  Both are rows of one native SolidCraft configuration table.
parameters: Free diameter 20.4 mm; Installed diameter 20.0 mm
