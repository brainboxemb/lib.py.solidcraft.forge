# Produce all active declarative SolidCraft verification in one runtime.
id: model-verification-batch
process: true
kind: verification
needs:
  - forge-package
  - cad-verification-package
watch:
  - scripts/forge_example.py
  - scripts/model_verify_declarative.py
  - scripts/model_verification_batch.py
  - scripts/model_visual.py
strategy:
  reuse: true
steps:
  - id: verify_models
    inputs:
      - examples/*/ci.yml
      - examples/*/scpf/**
      - examples/*/model.yml
      - examples/*/verification/**
      - scripts/forge_example.py
      - scripts/model_verify_declarative.py
      - scripts/model_verification_batch.py
      - scripts/model_visual.py
      - scpf/scpf/version.py
    run: [python, ../../scripts/model_verification_batch.py, batch]
    outputs:
      - models
