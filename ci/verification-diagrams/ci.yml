# Materialize CADCraft evidence produced by the shared reference runtime.
id: verification-diagrams
process: true
kind: verification
needs:
  - reference-verification-batch
watch:
  - verification/diagrams/sources/**
  - scripts/build_diagrams.py
  - scripts/reference_verification_batch.py
strategy:
  reuse: true
steps:
  - id: build_diagrams
    inputs:
      - verification/diagrams/sources/**
      - scripts/build_diagrams.py
      - scripts/reference_verification_batch.py
    run: [python, ../../scripts/reference_verification_batch.py, materialize-diagrams]
    outputs:
      - diagrams
