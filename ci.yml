schema: 1
branches:
  stable: main
  development: dev
  temporary_prefixes:
    - issue/
    - fix/
    - feature/
    - docs/
    - chore/
    - release/
    - resolve/
generated:
  build_branch: build
  pages_branch: gh-pages
qualification:
  pull_requests:
    docs_only:
      prefixes:
        - docs/
      modules:
        - ci
  permanent:
    reuse_pr_qualification:
      branches:
        - exp
runtimes:
  reference:
    image: ghcr.io/brainboxemb/cad-reference:v0.3.8
  solidcraft:
    image: ghcr.io/brainboxemb/cad-solidcraft:v0.3.8
    version: 0.50.0
  mitcad:
    image: ghcr.io/brainboxemb/cad-mitcad:v0.3.7
roots:
  modules: modules
  models: models
  api_probes: api-probes
  output: build
