name: CI

on:
  pull_request:
    branches: [dev, main, exp]
  push:
    branches: [dev, main, exp]
  workflow_dispatch:
    inputs:
      qualification_pr:
        description: Merged PR number whose green qualification may be reused.
        required: false
        type: string
        default: ""
      qualification_head_sha:
        description: Exact reviewed PR head SHA bound by merge policy.
        required: false
        type: string
        default: ""
      qualification_run_id:
        description: Exact green PR CI run id bound by merge policy.
        required: false
        type: string
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install CI runtime dependencies
        run: python -m pip install PyYAML==6.0.2

      - name: Validate release metadata delta
        if: >-
          github.base_ref == 'main' &&
          startsWith(github.head_ref, 'release/')
        env:
          PYTHONPATH: modules/release/src
        run: >-
          python -m cad_library_release.delta
          --source-root .
          --base-ref origin/main
          --target-ref HEAD

      - name: Run selected project items
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: modules/ci/src
        run: python -m cad_library_ci

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cad-qualification
          path: build/qualification/
          if-no-files-found: ignore

  build:
    name: build
    if: github.event_name != 'pull_request' && (github.ref_name == 'dev' || github.ref_name == 'main' || github.ref_name == 'exp')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Resolve current branch source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install CI runtime dependencies
        run: python -m pip install PyYAML==6.0.2

      - name: Reuse tree-identical PR qualification when configured
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: modules/ci/src
        run: >-
          python -m cad_library_ci.reuse
          --repository "${{ github.repository }}"
          --branch "${{ github.ref_name }}"
          --source-sha "${{ steps.source.outputs.sha }}"
          --qualification-pr "${{ github.event.inputs.qualification_pr || '' }}"
          --qualification-head-sha "${{ github.event.inputs.qualification_head_sha || '' }}"
          --qualification-run-id "${{ github.event.inputs.qualification_run_id || '' }}"
          --candidate build/qualification
          --github-output "$GITHUB_OUTPUT"

      - name: Report reused PR qualification
        if: steps.reuse.outputs.reuse == 'true'
        run: >-
          echo "Reusing green PR #${{ steps.reuse.outputs.pr_number }}
          run ${{ steps.reuse.outputs.run_id }}
          from ${{ steps.reuse.outputs.qualified_source_sha }}"

      - name: Run selected project items
        if: steps.reuse.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CAD_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PYTHONPATH: modules/ci/src
        run: python -m cad_library_ci

      - name: Publish build scope
        env:
          PYTHONPATH: modules/build/src
        run: >-
          python -m cad_library_build.publish
          --candidate build/qualification
          --source-ref "${{ github.ref_name }}"
          --source-sha "${{ steps.source.outputs.sha }}"

      - name: Dispatch Pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh api "repos/$GH_REPO/contents/.github/workflows/pages.yml?ref=main" --silent; then
            echo "Pages dispatch deferred until initial main promotion"
            exit 0
          fi
          gh workflow run pages.yml --ref main
