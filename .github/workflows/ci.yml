name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CI runtime dependencies
        run: python -m pip install PyYAML==6.0.2
      - name: Run selected project items
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: modules/ci/src
        run: python -m cad_library_ci

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cad-qualification
          path: build/qualification/
          if-no-files-found: ignore

  publish-build:
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.2
      - uses: actions/download-artifact@v8
        with:
          name: cad-qualification
          path: build/qualification/
      - name: Publish build scope
        env:
          PYTHONPATH: modules/build/src
        run: >-
          python -m cad_library_build.publish
          --candidate build/qualification
          --source-ref "${{ github.ref_name }}"
          --source-sha "${{ github.sha }}"

  dispatch-pages:
    needs: publish-build
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch Pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh api "repos/$GH_REPO/contents/.github/workflows/pages.yml?ref=main" --silent; then
            echo "Pages dispatch deferred until initial main promotion"
            exit 0
          fi
          gh workflow run pages.yml --ref main
