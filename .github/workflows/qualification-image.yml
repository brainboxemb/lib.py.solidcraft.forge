name: Qualification container image

on:
  push:
    branches-ignore:
      - build
      - gh-pages
    paths:
      - "docker/qualification/**"
      - "qualification/toolchain.json"
      - "qualification/integration/**"
      - "scripts/qualification_image.py"
      - ".github/workflows/qualification-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: qualification-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve immutable image identity
        id: meta
        run: |
          python scripts/qualification_image.py \
            --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build qualification image
        uses: docker/build-push-action@v6
        with:
          context: docker/qualification
          file: docker/qualification/Dockerfile
          load: true
          push: false
          tags: qualification-local:${{ steps.meta.outputs.image_id }}
          build-args: |
            SOLIDCRAFT_VERSION=${{ steps.meta.outputs.solidcraft }}
            CADCRAFT_VERSION=${{ steps.meta.outputs.cadcraft }}
            PYTHONSCAD_VERSION=${{ steps.meta.outputs.pythonscad }}
            PYBOSL2_REV=${{ steps.meta.outputs.pybosl2 }}
            CADQUERY_VERSION=${{ steps.meta.outputs.cadquery }}
            BUILD123D_VERSION=${{ steps.meta.outputs.build123d }}
            TRIMESH_SPEC=${{ steps.meta.outputs.trimesh }}
            MATPLOTLIB_SPEC=${{ steps.meta.outputs.matplotlib }}
          cache-from: type=gha,scope=qualification-image
          cache-to: type=gha,mode=max,scope=qualification-image

      - name: Run one-case integration smoke
        run: |
          mkdir -p "$RUNNER_TEMP/simple-box-smoke"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/simple-box-smoke:/smoke" \
            -w /workspace \
            -e PYTHONPATH=/workspace/scpf:/workspace \
            qualification-local:${{ steps.meta.outputs.image_id }} \
            python qualification/integration/simple_box.py --out /smoke

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-image-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/simple-box-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable qualification image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag \
            "qualification-local:${{ steps.meta.outputs.image_id }}" \
            "${{ steps.meta.outputs.reference }}"
          docker push "${{ steps.meta.outputs.reference }}"

          docker tag \
            "qualification-local:${{ steps.meta.outputs.image_id }}" \
            "${{ steps.meta.outputs.alias }}"
          docker push "${{ steps.meta.outputs.alias }}"
