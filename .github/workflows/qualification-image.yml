name: Qualification container image

on:
  push:
    branches-ignore:
      - build
      - gh-pages
    paths:
      - "docker/qualification/**"
      - "qualification/toolchain.json"
      - "scpf/scpf/version.py"
      - "scripts/qualification_image.py"
      - ".github/workflows/qualification-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: qualification-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve immutable image identity
        id: meta
        run: |
          python scripts/qualification_image.py \
            --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse existing immutable image
        id: existing
        run: |
          if timeout 30s docker pull "${{ steps.meta.outputs.reference }}"; then
            docker tag \
              "${{ steps.meta.outputs.reference }}" \
              "qualification-local:${{ steps.meta.outputs.image_id }}"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build qualification image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/qualification
          file: docker/qualification/Dockerfile
          load: true
          push: false
          tags: qualification-local:${{ steps.meta.outputs.image_id }}
          build-args: |
            PYTHON_IMAGE=${{ steps.meta.outputs.python_image }}
            SOLIDCRAFT_VERSION=${{ steps.meta.outputs.solidcraft }}
            CADCRAFT_VERSION=${{ steps.meta.outputs.cadcraft }}
            CADCRAFT_SHA256=${{ steps.meta.outputs.cadcraft_sha256 }}
            PYTHONSCAD_VERSION=${{ steps.meta.outputs.pythonscad }}
            PYBOSL2_REV=${{ steps.meta.outputs.pybosl2 }}
            CADQUERY_VERSION=${{ steps.meta.outputs.cadquery }}
            BUILD123D_VERSION=${{ steps.meta.outputs.build123d }}
            TRIMESH_SPEC=${{ steps.meta.outputs.trimesh }}
            MATPLOTLIB_SPEC=${{ steps.meta.outputs.matplotlib }}
          cache-from: type=gha,scope=qualification-image
          cache-to: type=gha,mode=max,scope=qualification-image

      - name: Run complete simple-box staged case
        if: steps.existing.outputs.exists != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/simple-box-case"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/simple-box-case:/case-out" \
            -w /workspace \
            -e PYTHONPATH=/workspace/scpf:/workspace \
            qualification-local:${{ steps.meta.outputs.image_id }} \
            python qualification/case_runner.py simple-box \
              --out /case-out

      - name: Prove one-stage rerun
        if: steps.existing.outputs.exists != 'true'
        run: |
          before="$(python - <<'PY'
          import json
          from pathlib import Path
          root=Path("$RUNNER_TEMP/simple-box-case/stages/simple-box")
          print(json.loads((root/"08-mutate.json").read_text())["started_at"])
          PY
          )"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/simple-box-case:/case-out" \
            -w /workspace \
            -e PYTHONPATH=/workspace/scpf:/workspace \
            qualification-local:${{ steps.meta.outputs.image_id }} \
            python qualification/case_runner.py simple-box \
              --out /case-out \
              --stage mutate
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("$RUNNER_TEMP/simple-box-case/stages/simple-box")
          mutate=json.loads((root/"08-mutate.json").read_text())
          replay=json.loads((root/"04-replay.json").read_text())
          assert mutate["status"] == "pass", mutate
          assert replay["status"] == "pass", replay
          print("single-stage rerun PASS")
          PY

      - name: Upload staged-case diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-image-simple-box-${{ github.sha }}
          path: ${{ runner.temp }}/simple-box-case
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish immutable qualification image
        if: steps.existing.outputs.exists != 'true'
        run: |
          docker tag \
            "qualification-local:${{ steps.meta.outputs.image_id }}" \
            "${{ steps.meta.outputs.reference }}"
          docker push "${{ steps.meta.outputs.reference }}"

      - name: Publish readable main alias
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag \
            "qualification-local:${{ steps.meta.outputs.image_id }}" \
            "${{ steps.meta.outputs.alias }}"
          docker push "${{ steps.meta.outputs.alias }}"
