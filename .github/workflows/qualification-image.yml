name: Qualification container image

on:
  push:
    branches-ignore:
      - build
      - gh-pages
    paths:
      - "docker/qualification/**"
      - "qualification/toolchain.json"
      - "scpf/scpf/version.py"
      - "qualification/integration/**"
      - "qualification/run_case_evidence.py"
      - "qualification/run_affected.py"
      - "qualification/native_cases.py"
      - "qualification/native_validation.py"
      - "qualification/visual_validation.py"
      - "scripts/verification_gate.py"
      - "examples/simple-box/**"
      - "scpf/**"
      - "scripts/qualification_image.py"
      - ".github/workflows/qualification-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: qualification-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve immutable image identity
        id: meta
        run: |
          python scripts/qualification_image.py \
            --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse existing immutable image on main
        id: existing
        if: github.ref == 'refs/heads/main'
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.reference }}" >/dev/null 2>&1; then
            docker pull "${{ steps.meta.outputs.reference }}"
            docker tag \
              "${{ steps.meta.outputs.reference }}" \
              "qualification-local:${{ steps.meta.outputs.image_id }}"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build qualification image
        if: github.ref != 'refs/heads/main' || steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/qualification
          file: docker/qualification/Dockerfile
          load: true
          push: false
          tags: qualification-local:${{ steps.meta.outputs.image_id }}
          build-args: |
            PYTHON_IMAGE=${{ steps.meta.outputs.python_image }}
            SOLIDCRAFT_VERSION=${{ steps.meta.outputs.solidcraft }}
            CADCRAFT_VERSION=${{ steps.meta.outputs.cadcraft }}
            CADCRAFT_SHA256=${{ steps.meta.outputs.cadcraft_sha256 }}
            PYTHONSCAD_VERSION=${{ steps.meta.outputs.pythonscad }}
            PYBOSL2_REV=${{ steps.meta.outputs.pybosl2 }}
            CADQUERY_VERSION=${{ steps.meta.outputs.cadquery }}
            BUILD123D_VERSION=${{ steps.meta.outputs.build123d }}
            TRIMESH_SPEC=${{ steps.meta.outputs.trimesh }}
            MATPLOTLIB_SPEC=${{ steps.meta.outputs.matplotlib }}
          cache-from: type=gha,scope=qualification-image
          cache-to: type=gha,mode=max,scope=qualification-image

      - name: Run one-case integration smoke
        run: |
          mkdir -p "$RUNNER_TEMP/simple-box-smoke"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/simple-box-smoke:/smoke" \
            -w /workspace \
            -e PYTHONPATH=/workspace/scpf:/workspace \
            qualification-local:${{ steps.meta.outputs.image_id }} \
            python qualification/integration/simple_box.py --out /smoke/simple-box

      - name: Run real one-case qualification gate
        run: |
          mkdir -p "$RUNNER_TEMP/simple-box-gate"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/simple-box-gate:/gate" \
            -w /workspace \
            -e PYTHONPATH=/workspace/scpf:/workspace \
            qualification-local:${{ steps.meta.outputs.image_id }} \
            python scripts/verification_gate.py \
              --gate affected-q1-q6 \
              --cases simple-box \
              --out /gate/simple-box \
              --source-sha "$GITHUB_SHA"

      - name: Upload one-case gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-image-gate-${{ github.sha }}
          path: ${{ runner.temp }}/simple-box-gate
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-image-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/simple-box-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish immutable qualification image
        if: github.ref == 'refs/heads/main' && steps.existing.outputs.exists != 'true'
        run: |
          docker tag \
            "qualification-local:${{ steps.meta.outputs.image_id }}" \
            "${{ steps.meta.outputs.reference }}"
          docker push "${{ steps.meta.outputs.reference }}"

          docker tag \
            "qualification-local:${{ steps.meta.outputs.image_id }}" \
            "${{ steps.meta.outputs.alias }}"
          docker push "${{ steps.meta.outputs.alias }}"
