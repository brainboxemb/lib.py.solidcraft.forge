name: SolidCraft command-contract snapshot

on:
  pull_request:
    paths:
      - "scpf/scpf/**"
      - "scripts/solidcraft_snapshot.py"
      - "docs/vendor/solidcraft/**"
      - ".github/workflows/solidcraft-contracts.yml"
  push:
    branches:
      - main
      - "qualify/**"
      - "qualification/**"
    paths:
      - "scpf/scpf/**"
      - "scripts/solidcraft_snapshot.py"
      - "docs/vendor/solidcraft/**"
      - ".github/workflows/solidcraft-contracts.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read qualified SolidCraft version from Forge
        shell: bash
        run: |
          version="$(PYTHONPATH=scpf python -c 'from scpf.version import TESTED_SOLIDCRAFT_VERSION; print(TESTED_SOLIDCRAFT_VERSION)')"
          echo "SOLIDCRAFT_VERSION=$version" >> "$GITHUB_ENV"
          echo "SolidCraft contract snapshot target: $version"
      - name: Check saved snapshot against Forge source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/solidcraft_snapshot.py \
            --check-pinned "docs/vendor/solidcraft/$SOLIDCRAFT_VERSION/runtime"
      - name: Install official SolidCraft release (checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/tangency-labs/solidcraft/releases/download/v${SOLIDCRAFT_VERSION}"
          archive="solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error "$base/SHA256SUMS.txt" --output SHA256SUMS.txt
          curl --fail --location --retry 3 --silent --show-error "$base/$archive" --output "$archive"
          grep -F " $archive" SHA256SUMS.txt | sha256sum --check
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Regenerate snapshot from the pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          solidcraft-cli --version
          python scripts/solidcraft_snapshot.py \
            --out output/solidcraft-snapshot \
            --version "$SOLIDCRAFT_VERSION" \
            --source-ref "v$SOLIDCRAFT_VERSION"
      - name: Require checked-in snapshot to match the runtime exactly
        shell: bash
        run: |
          set -euo pipefail
          diff -ru \
            "docs/vendor/solidcraft/$SOLIDCRAFT_VERSION/runtime" \
            output/solidcraft-snapshot
      - name: Upload regenerated snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-contract-snapshot-${{ github.sha }}
          path: output/solidcraft-snapshot
          if-no-files-found: warn
          retention-days: 30
