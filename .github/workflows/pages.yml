name: Pages

on:
  pull_request:
    branches: [dev, main]
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "modules/pages/**"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: pages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true
      - run: python -m pip install PyYAML==6.0.2
      - name: Read matching durable build scope
        run: |
          mkdir -p prepared-build
          git fetch --no-tags --depth=1 origin build
          git archive FETCH_HEAD | tar -x -C prepared-build
      - name: Build and verify site
        env:
          PYTHONPATH: modules/pages/src
        run: >-
          python -m cad_library_pages.build
          --source-root .
          --destination generated-site
          --build-scope prepared-build/${{ github.base_ref }}
          --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.base_ref == 'dev' && 'dev/' || '' }}"
      - name: Check rendered routes and evidence links
        env:
          PYTHONPATH: modules/pages/src
        run: >-
          python -m cad_library_pages.verify
          --source-root .
          --site generated-site
          --build-scope prepared-build/${{ github.base_ref }}
      - name: Capture rendered layout
        env:
          PYTHONPATH: modules/pages/src
        run: >-
          python -m cad_library_pages.capture
          --site generated-site
          --base-path "/${{ github.event.repository.name }}/${{ github.base_ref == 'dev' && 'dev/' || '' }}"
          --output layout-evidence
      - uses: actions/upload-artifact@v7
        with:
          name: layout-evidence
          path: layout-evidence
          if-no-files-found: error

  assemble:
    name: pages-build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out stable source
        uses: actions/checkout@v7
        with:
          ref: main
          path: source-main
          fetch-depth: 1
      - name: Check out development source
        uses: actions/checkout@v7
        with:
          ref: dev
          path: source-dev
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.2
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true
      - name: Read generated build branch when present
        run: |
          mkdir -p prepared-build
          if git -C source-main ls-remote --exit-code --heads origin refs/heads/build; then
            git -C source-main fetch --no-tags --depth=1 origin build
            git -C source-main archive FETCH_HEAD | tar -x -C prepared-build
          else
            status=$?
            test "$status" -eq 2
          fi
      - name: Build stable site
        env:
          PYTHONPATH: source-main/modules/pages/src
        run: >-
          python -m cad_library_pages.build
          --source-root source-main
          --build-scope prepared-build/main
          --destination generated-site
          --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - name: Build development site
        env:
          PYTHONPATH: source-dev/modules/pages/src
        run: >-
          python -m cad_library_pages.build
          --source-root source-dev
          --build-scope prepared-build/dev
          --destination generated-site/dev
          --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/dev/"
      - name: Publish Pages branch
        env:
          PYTHONPATH: source-main/modules/pages/src
        run: >-
          python -m cad_library_pages.publish
          --repo source-main
          --site "${GITHUB_WORKSPACE}/generated-site"
          --source-ref main
          --source-sha "$(git -C source-main rev-parse HEAD)"
