name: SCPF generated-output reconcile

on:
  workflow_dispatch: {}
  schedule:
    - cron: "41 4 * * *"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: reconcile-generated-output
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconcile generated PR namespaces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/reconcile_generated.py \
            --repository "$GITHUB_REPOSITORY" \
            --apply
