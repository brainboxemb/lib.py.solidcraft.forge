name: Publish SCPF v0.1.0 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.1.0.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show b66d6bd3cde4429cc98145f6f9c35f23723220a9:scpf/pyproject.toml | sed -n 's/^version = "\(.*\)"/\1/p')" = "0.1.0"
          test "$(git show b66d6bd3cde4429cc98145f6f9c35f23723220a9:scpf/scpf/version.py | sed -n 's/^TESTED_SOLIDCRAFT_VERSION = "\(.*\)"/\1/p')" = "0.42.0"

      - name: Build release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          start = text.index("## [0.1.0]")
          end = text.find("\n## [", start + 1)
          if end < 0:
              end = len(text)
          Path("release-notes.md").write_text(
              text[start:end].strip() + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create Git tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.1.0 already exists"
            exit 0
          fi
          gh release create v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target b66d6bd3cde4429cc98145f6f9c35f23723220a9 \
            --title "SCPF v0.1.0" \
            --notes-file release-notes.md
