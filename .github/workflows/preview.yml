name: SCPF PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "scpf/**"
      - "examples/**"
      - "qualification/**"
      - "site/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "scripts/release/**"
      - "scripts/generated_output.py"
      - "scripts/ci_preflight.py"
      - ".github/workflows/preview.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/scpf.yml"
      - ".github/workflows/scpf-affected.yml"

permissions:
  contents: write

concurrency:
  group: scpf-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      has_cases: ${{ steps.preview_scope.outputs.has_cases }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCPF
        run: python -m pip install -e ./scpf pillow pyyaml

      - name: Read Forge version
        shell: bash
        run: |
          forge_version="$(python -c 'from importlib.metadata import version; print(version("scpf"))')"
          echo "FORGE_VERSION=$forge_version" >> "$GITHUB_ENV"

      - name: Determine affected preview scope
        id: preview_scope
        shell: bash
        run: |
          set -euo pipefail
          python qualification/preview_scope.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Run repository preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci_preflight.py \
            --source-sha "${{ github.event.pull_request.head.sha }}" \
            --site-out output/site

      - name: Publish verification plan
        shell: bash
        run: |
          {
            echo "### Verification plan"
            echo ""
            echo "- Affected cases: \`${{ steps.preview_scope.outputs.cases || 'none' }}\`"
            echo "- PR gate: affected Q1/Q2 only"
            echo "- Final gate: \`${{ steps.preview_scope.outputs.final_gate }}\`"
            echo "- Reference smoke: \`${{ steps.preview_scope.outputs.reference_smoke }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore rendered CADCraft diagrams
        id: cadcraft_diagrams
        uses: actions/cache@v4
        with:
          path: output/diagrams
          key: cadcraft-diagrams-v0.20.1-${{ hashFiles('qualification/diagrams/*.cadcraft.json', 'qualification/render_cadcraft_diagram.sh') }}

      - name: Cache CADCraft CLI
        if: steps.cadcraft_diagrams.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/cadcraft/0.20.1-linux-x86_64
          key: cadcraft-0.20.1-linux-x86_64

      - name: Set up CADCraft CLI
        if: steps.cadcraft_diagrams.outputs.cache-hit != 'true'
        shell: bash
        run: bash qualification/setup_cadcraft.sh

      - name: Render technical qualification diagrams
        if: steps.cadcraft_diagrams.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/diagrams
          for plan in qualification/diagrams/*.cadcraft.json; do
            bash qualification/render_cadcraft_diagram.sh "$plan" output/diagrams
          done

      - name: Run fast Python API tests
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          cd "$RUNNER_TEMP"
          python -m unittest discover -s "$GITHUB_WORKSPACE/scpf/tests" -v
          if [ -n "${{ steps.preview_scope.outputs.cases }}" ]; then
            python "$GITHUB_WORKSPACE/qualification/run_case_evidence.py" \
              --level q1 \
              --cases "${{ steps.preview_scope.outputs.cases }}" \
              --out "$GITHUB_WORKSPACE/output/qualification"
          fi

      - name: Run standard qualification tests
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/qualification/testsuite.py"
          if [ -n "${{ steps.preview_scope.outputs.cases }}" ]; then
            python "$GITHUB_WORKSPACE/qualification/run_case_evidence.py" \
              --level q2 \
              --cases "${{ steps.preview_scope.outputs.cases }}" \
              --out "$GITHUB_WORKSPACE/output/qualification"
          fi

      - name: Install pinned comparison libraries
        if: steps.preview_scope.outputs.reference_smoke == 'true'
        run: |
          python -m pip install \
            "pythonscad==1.1.2" \
            "git+https://github.com/pinkfish/pybosl2@d4279910c12435ed7224b3406616e495db1c96ec" \
            "cadquery==2.8.0" \
            "trimesh>=4,<5" \
            "matplotlib>=3.8,<4"

      - name: Set up isolated build123d reference environment
        if: steps.preview_scope.outputs.reference_smoke == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/build123d-venv"
          "$RUNNER_TEMP/build123d-venv/bin/python" -m pip install \
            "build123d==0.12.0"
          echo "BUILD123D_PYTHON=$RUNNER_TEMP/build123d-venv/bin/python" >> "$GITHUB_ENV"

      - name: Execute and render reference smoke case
        if: steps.preview_scope.outputs.reference_smoke == 'true'
        run: |
          cases="${{ steps.preview_scope.outputs.cases }}"
          if [ -z "$cases" ]; then
            cases="simple-box"
          fi
          python qualification/reference_validation.py \
            --cases "$cases" \
            --out output/reference-smoke \
            --source-sha "$GITHUB_SHA"

      - name: Compile qualification tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            qualification/camera.py \
            qualification/goal_overlay.py \
            qualification/native_validation.py \
            qualification/reference_validation.py \
            qualification/build123d_export.py \
            qualification/preview_scope.py \
            qualification/run_affected.py \
            qualification/case_selection.py \
            qualification/native_cases.py \
            qualification/case_evidence.py \
            qualification/run_case_evidence.py \
            qualification/results.py \
            qualification/report.py \
            qualification/visual_validation.py \
            scripts/release/validate_release.py

      - name: Compile affected qualification fixtures
        if: steps.preview_scope.outputs.has_cases == 'true'
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          mkdir -p output
          cases="${{ steps.preview_scope.outputs.cases }}"
          for model in ${cases//,/ }; do
            python -m scpf "examples/$model/scpf/model.py" --out "output/$model.json"
            python -m json.tool "output/$model.json" >/dev/null
          done

      - name: Assemble PR technical build
        if: steps.preview_scope.outputs.has_cases == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generated_output.py assemble-build \
            --output-root output \
            --destination output/build \
            --scope pr \
            --source-ref "${{ github.head_ref }}" \
            --source-commit "${{ github.event.pull_request.head.sha }}" \
            --pull-request "${{ github.event.pull_request.number }}" \
            --forge-version "$FORGE_VERSION" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --qualification-level q1-q2-affected \
            --qualification-status pass
          python scripts/generated_output.py verify-build \
            --root output/build \
            --source-commit "${{ github.event.pull_request.head.sha }}"

      - name: Upload PR technical build
        if: steps.preview_scope.outputs.has_cases == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scpf-build-pr-${{ github.event.pull_request.number }}
          path: output/build
          if-no-files-found: error
          retention-days: 14

      - name: Finalize Pages preview
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${{ github.event.pull_request.head.sha }}"
          python site/provenance.py write \
            --out output/site/provenance.json \
            --stage preview \
            --source-ref "${{ github.head_ref }}" \
            --source-commit "$source_sha" \
            --pull-request "${{ github.event.pull_request.number }}" \
            --forge-version "$FORGE_VERSION" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --qualification-level "q1-q2-affected" \
            --qualification-status pass
          python site/provenance.py verify \
            --file output/site/provenance.json \
            --stage preview \
            --source-commit "$source_sha"

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: scpf-preview-pr-${{ github.event.pull_request.number }}
          path: output/site
          if-no-files-found: error
          retention-days: 14

  publish-build:
    name: publish-build
    needs: preview
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && needs.preview.outputs.has_cases == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: scpf-build-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scpf-build-pr-${{ github.event.pull_request.number }}
          path: output/build

      - name: Publish PR technical build
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: build
          publish_dir: ./output/build
          destination_dir: pr/${{ github.event.pull_request.number }}
          enable_jekyll: true
          commit_message: "Publish build PR #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}"

  publish-preview:
    name: publish-preview
    needs: preview
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: scpf-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: scpf-preview-pr-${{ github.event.pull_request.number }}
          path: output/site

      - name: Verify built PR preview provenance
        run: |
          python site/provenance.py verify \
            --file output/site/provenance.json \
            --stage preview \
            --source-commit "${{ github.event.pull_request.head.sha }}"

      - name: Publish PR preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./output/site
          destination_dir: previews/pr-${{ github.event.pull_request.number }}
          commit_message: "Publish preview PR #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}"

  cleanup-build:
    name: cleanup-build
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: scpf-build-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: source
          fetch-depth: 1

      - uses: actions/checkout@v4
        id: build_branch
        continue-on-error: true
        with:
          ref: build
          path: generated-build
          fetch-depth: 1

      - name: Remove closed PR build
        if: steps.build_branch.outcome == 'success'
        run: |
          python source/scripts/generated_output.py remove-pr \
            --root generated-build \
            --kind build \
            --pull-request "${{ github.event.pull_request.number }}"
          cd generated-build
          if test -n "$(git status --porcelain)"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Remove build PR #${{ github.event.pull_request.number }}"
            git push origin HEAD:build
          fi

  cleanup-preview:
    name: cleanup-preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: scpf-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: source
          fetch-depth: 1

      - uses: actions/checkout@v4
        id: pages_branch
        continue-on-error: true
        with:
          ref: gh-pages
          path: generated-pages
          fetch-depth: 1

      - name: Remove closed PR preview
        if: steps.pages_branch.outcome == 'success'
        run: |
          python source/scripts/generated_output.py remove-pr \
            --root generated-pages \
            --kind pages \
            --pull-request "${{ github.event.pull_request.number }}"
          cd generated-pages
          if test -n "$(git status --porcelain)"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Remove preview PR #${{ github.event.pull_request.number }}"
            git push origin HEAD:gh-pages
          fi
