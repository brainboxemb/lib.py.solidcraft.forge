name: SCPF PR verification and preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    paths:
      - "scpf/**"
      - "examples/**"
      - "qualification/**"
      - "site/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/**"
      - "AGENTS.md"
      - "README.md"
      - "CHANGELOG.md"

permissions:
  contents: write
  actions: write

jobs:
  verify:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: verify-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Forge and preflight dependencies
        run: python -m pip install -e ./scpf pillow pyyaml

      - name: Determine verification scope
        id: scope
        run: |
          python qualification/preview_scope.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Run repository preflight
        run: |
          python scripts/ci_preflight.py \
            --source-sha "${{ github.event.pull_request.head.sha }}" \
            --site-out output/preflight-site

      - name: Install SolidCraft for native/full gate
        if: steps.scope.outputs.final_gate == 'affected-q1-q6' || steps.scope.outputs.final_gate == 'full-q1-q6'
        run: |
          python qualification/setup_solidcraft.py \
            --destination "$RUNNER_TEMP/solidcraft" \
            --github-path "$GITHUB_PATH"

      - name: Install reference environments when required
        if: steps.scope.outputs.reference_smoke == 'true' || steps.scope.outputs.final_gate == 'full-q1-q6'
        run: |
          python qualification/setup_references.py \
            --build123d-venv "$RUNNER_TEMP/build123d-venv" \
            --github-env "$GITHUB_ENV"

      - name: Run selected merge gate
        env:
          SOLIDCRAFT_GPU: cpu
        run: |
          args=()
          if [ "${{ steps.scope.outputs.reference_smoke }}" = "true" ]; then
            args+=(--reference-smoke)
          fi
          python scripts/verification_gate.py \
            --gate "${{ steps.scope.outputs.final_gate }}" \
            --cases "${{ steps.scope.outputs.cases }}" \
            --out output/gate \
            --source-sha "${{ github.event.pull_request.head.sha }}" \
            --build-out output/build \
            --scope pr \
            --source-ref "${{ github.head_ref }}" \
            --pull-request "${{ github.event.pull_request.number }}" \
            --base-commit "${{ github.event.pull_request.base.sha }}" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            "${args[@]}"

      - uses: actions/checkout@v4
        with:
          ref: build
          path: generated-build
          fetch-depth: 1

      - name: Publish current PR technical overlay
        id: publish_build
        if: steps.scope.outputs.has_cases == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python scripts/publish_generated.py replace-dir \
            --branch build \
            --source output/build \
            --destination "pr/${{ github.event.pull_request.number }}" \
            --source-ref "${{ github.head_ref }}" \
            --expected-source "${{ github.event.pull_request.head.sha }}" \
            --message "Publish build PR #${{ github.event.pull_request.number }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Remove obsolete PR technical overlay
        if: steps.scope.outputs.has_cases != 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python scripts/publish_generated.py remove-dir \
            --branch build \
            --destination "pr/${{ github.event.pull_request.number }}" \
            --source-ref "${{ github.head_ref }}" \
            --expected-source "${{ github.event.pull_request.head.sha }}" \
            --message "Remove obsolete build PR #${{ github.event.pull_request.number }}"

      - name: Resolve preview evidence
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          build_commit="${{ steps.publish_build.outputs.commit }}"
          if [ -z "$build_commit" ]; then
            build_commit="$(git -C generated-build rev-parse HEAD)"
          fi
          echo "BUILD_COMMIT=$build_commit" >> "$GITHUB_ENV"
          if [ "${{ steps.scope.outputs.has_cases }}" = "true" ]; then
            python scripts/generated_output.py resolve-preview \
              --main generated-build/main \
              --overlay output/build \
              --destination output/resolved
          else
            python scripts/generated_output.py resolve-preview \
              --main generated-build/main \
              --destination output/resolved
          fi
          python scripts/generated_output.py materialize-site-evidence \
            --build-root output/resolved \
            --destination output/evidence

      - name: Build and test PR website
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python site/build.py \
            --out output/site \
            --source-sha "${{ github.event.pull_request.head.sha }}" \
            --native output/evidence/native \
            --references output/evidence/references \
            --diagram-root output/evidence/diagrams \
            --build-manifest output/resolved/build.json \
            --build-commit "$BUILD_COMMIT" \
            --build-scope main
          python site/test_site.py \
            output/site "${{ github.event.pull_request.head.sha }}" \
            --build-commit="$BUILD_COMMIT"
          python site/provenance.py write-build \
            --out output/site/provenance.json \
            --stage preview \
            --source-ref "${{ github.head_ref }}" \
            --source-commit "${{ github.event.pull_request.head.sha }}" \
            --pull-request "${{ github.event.pull_request.number }}" \
            --build-commit "$BUILD_COMMIT" \
            --build-manifest output/resolved/build.json \
            --workflow-run-id "$GITHUB_RUN_ID"

      - name: Publish PR website
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python scripts/publish_generated.py replace-dir \
            --branch gh-pages \
            --source output/site \
            --destination "previews/pr-${{ github.event.pull_request.number }}" \
            --source-ref "${{ github.head_ref }}" \
            --expected-source "${{ github.event.pull_request.head.sha }}" \
            --message "Publish preview PR #${{ github.event.pull_request.number }}"

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scpf-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            output/gate
            output/build
            output/site
          if-no-files-found: ignore
          retention-days: 14

  close:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: close-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Forge publication dependencies
        run: python -m pip install -e ./scpf pillow pyyaml

      - name: Fetch merged PR head for tree comparison
        if: github.event.pull_request.merged == true
        run: git fetch origin "refs/pull/${{ github.event.pull_request.number }}/head"

      - uses: actions/checkout@v4
        with:
          ref: build
          path: generated-build
          fetch-depth: 1

      - name: Prepare technical promotion
        if: github.event.pull_request.merged == true
        id: promote
        run: |
          python scripts/merge_promotion.py \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --merge-sha "${{ github.event.pull_request.merge_commit_sha }}" \
            --pull-request "${{ github.event.pull_request.number }}" \
            --build-root generated-build \
            --destination output/main \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish promoted main technical evidence
        if: github.event.pull_request.merged == true && steps.promote.outputs.promotable == 'true'
        id: publish_main
        run: |
          python scripts/publish_generated.py replace-dir \
            --branch build \
            --source output/main \
            --destination main \
            --source-ref main \
            --expected-source "${{ github.event.pull_request.merge_commit_sha }}" \
            --message "Promote PR #${{ github.event.pull_request.number }} to build/main" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build stable website from promoted evidence
        if: github.event.pull_request.merged == true && steps.promote.outputs.promotable == 'true'
        run: |
          build_commit="${{ steps.publish_main.outputs.commit }}"
          python scripts/generated_output.py materialize-site-evidence \
            --build-root output/main \
            --destination output/evidence
          python site/build.py \
            --out output/site \
            --source-sha "${{ github.event.pull_request.merge_commit_sha }}" \
            --native output/evidence/native \
            --references output/evidence/references \
            --diagram-root output/evidence/diagrams \
            --build-manifest output/main/build.json \
            --build-commit "$build_commit" \
            --build-scope main
          python site/test_site.py \
            output/site "${{ github.event.pull_request.merge_commit_sha }}" \
            --build-commit="$build_commit"
          python site/provenance.py write-build \
            --out output/site/provenance.json \
            --stage stable \
            --source-ref main \
            --source-commit "${{ github.event.pull_request.merge_commit_sha }}" \
            --build-commit "$build_commit" \
            --build-manifest output/main/build.json \
            --workflow-run-id "$GITHUB_RUN_ID"
          python scripts/publish_generated.py replace-stable-pages \
            --branch gh-pages \
            --source output/site \
            --source-ref main \
            --expected-source "${{ github.event.pull_request.merge_commit_sha }}" \
            --message "Publish stable site after PR #${{ github.event.pull_request.number }}"

      - name: Request full safety rebuild when merge tree differs
        if: github.event.pull_request.merged == true && steps.promote.outputs.technical == 'true' && steps.promote.outputs.promotable != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scpf.yml --ref main

      - name: Remove closed PR technical overlay
        run: |
          python scripts/publish_generated.py remove-dir \
            --branch build \
            --destination "pr/${{ github.event.pull_request.number }}" \
            --message "Remove build PR #${{ github.event.pull_request.number }}"

      - name: Remove closed PR website preview
        run: |
          python scripts/publish_generated.py remove-dir \
            --branch gh-pages \
            --destination "previews/pr-${{ github.event.pull_request.number }}" \
            --message "Remove preview PR #${{ github.event.pull_request.number }}"
