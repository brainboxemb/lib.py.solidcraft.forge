name: SCPF site-only deploy

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "qualification/templates/**"
      - ".github/workflows/site.yml"
      - "scripts/reusable_qualification.py"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: scpf-pages-publish
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm reusable technical evidence
        id: scope
        run: |
          python scripts/reusable_qualification.py scope \
            --base "${{ github.event.before }}" \
            --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Install SCPF for site generation
        if: steps.scope.outputs.site_only == 'true'
        run: python -m pip install -e ./scpf pillow

      - name: Find reusable qualification evidence
        if: steps.scope.outputs.site_only == 'true'
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/reusable_qualification.py select \
            --head "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download qualification evidence
        if: steps.scope.outputs.site_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reused
          gh run download "${{ steps.evidence.outputs.run_id }}"             --repo "$GITHUB_REPOSITORY"             --name "scpf-qualification-${{ steps.evidence.outputs.sha }}"             --dir reused
          test -f reused/native/verification.json
          test -f reused/references/summary.json

      - name: Restore rendered CADCraft diagrams
        if: steps.scope.outputs.site_only == 'true'
        id: cadcraft_diagrams
        uses: actions/cache@v4
        with:
          path: output/diagrams
          key: cadcraft-diagrams-v0.20.1-${{ hashFiles('qualification/diagrams/*.cadcraft.json', 'qualification/render_cadcraft_diagram.sh') }}

      - name: Cache CADCraft CLI
        if: steps.scope.outputs.site_only == 'true' && steps.cadcraft_diagrams.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/cadcraft/0.20.1-linux-x86_64
          key: cadcraft-0.20.1-linux-x86_64

      - name: Build missing diagrams
        if: steps.scope.outputs.site_only == 'true' && steps.cadcraft_diagrams.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash qualification/setup_cadcraft.sh
          mkdir -p output/diagrams
          for plan in qualification/diagrams/*.cadcraft.json; do
            bash qualification/render_cadcraft_diagram.sh "$plan" output/diagrams
          done

      - name: Build and test site with reused qualification evidence
        if: steps.scope.outputs.site_only == 'true'
        shell: bash
        run: |
          set -euo pipefail
          evidence_sha="${{ steps.evidence.outputs.sha }}"
          python site/build.py             --out output/site             --source-sha "$GITHUB_SHA"             --evidence-sha "$evidence_sha"             --native reused/native             --references reused/references             --diagram-root output/diagrams
          python site/test_site.py output/site "$GITHUB_SHA"             --evidence-sha="$evidence_sha"             --require-native --require-references

      - name: Write reused qualification provenance
        if: steps.scope.outputs.site_only == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python site/provenance.py write-reused \
            --out output/site/provenance.json \
            --stage stable \
            --source-ref main \
            --source-commit "$GITHUB_SHA" \
            --evidence-commit "${{ steps.evidence.outputs.sha }}" \
            --verification reused/native/verification.json \
            --workflow-run-id "$GITHUB_RUN_ID"
          python site/provenance.py verify \
            --file output/site/provenance.json \
            --stage stable \
            --source-commit "$GITHUB_SHA"

      - uses: actions/checkout@v4
        if: steps.scope.outputs.site_only == 'true'
        with:
          ref: gh-pages
          path: current-pages
          fetch-depth: 1

      - name: Prepare stable Pages root
        if: steps.scope.outputs.site_only == 'true'
        run: |
          python scripts/generated_output.py prepare-stable-pages \
            --site output/site \
            --current-pages current-pages \
            --destination output/pages-stable

      - name: Publish current library site
        if: steps.scope.outputs.site_only == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./output/pages-stable
          force_orphan: true
          commit_message: "SCPF site-only build at ${{ github.sha }} using qualification ${{ steps.evidence.outputs.sha }}"
