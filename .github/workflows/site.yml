name: SCPF presentation-only site deploy

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "qualification/templates/**"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/site.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-pages-main
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Forge site dependencies
        run: python -m pip install -e ./scpf pillow pyyaml

      - name: Confirm this push is presentation-only
        id: scope
        run: |
          python scripts/reusable_qualification.py scope \
            --base "${{ github.event.before }}" \
            --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.scope.outputs.site_only == 'true'
        with:
          ref: build
          path: generated-build
          fetch-depth: 1

      - name: Verify canonical technical baseline is complete
        if: steps.scope.outputs.site_only == 'true'
        run: |
          python scripts/generated_output.py verify-build \
            --root generated-build/main \
            --require-complete
          echo "BUILD_COMMIT=$(git -C generated-build rev-parse HEAD)" >> "$GITHUB_ENV"
          evidence_sha="$(python -c 'import json; print(json.load(open("generated-build/main/build.json", encoding="utf-8"))["source_commit"])')"
          echo "EVIDENCE_SHA=$evidence_sha" >> "$GITHUB_ENV"

      - name: Build site from canonical build/main evidence
        if: steps.scope.outputs.site_only == 'true'
        run: |
          python scripts/generated_output.py materialize-site-evidence \
            --build-root generated-build/main \
            --destination output/evidence
          python site/build.py \
            --out output/site \
            --source-sha "$GITHUB_SHA" \
            --native output/evidence/native \
            --references output/evidence/references \
            --diagram-root output/evidence/diagrams \
            --build-manifest generated-build/main/build.json \
            --build-commit "$BUILD_COMMIT" \
            --build-scope main
          python site/test_site.py \
            output/site "$GITHUB_SHA" \
            --evidence-sha="$EVIDENCE_SHA" \
            --build-commit="$BUILD_COMMIT"
          python site/provenance.py write-build \
            --out output/site/provenance.json \
            --stage stable \
            --source-ref main \
            --source-commit "$GITHUB_SHA" \
            --build-commit "$BUILD_COMMIT" \
            --build-manifest generated-build/main/build.json \
            --workflow-run-id "$GITHUB_RUN_ID"

      - name: Publish stable presentation
        if: steps.scope.outputs.site_only == 'true'
        run: |
          python scripts/publish_generated.py replace-stable-pages \
            --branch gh-pages \
            --source output/site \
            --source-ref main \
            --expected-source "$GITHUB_SHA" \
            --message "Publish presentation-only site at $GITHUB_SHA"
