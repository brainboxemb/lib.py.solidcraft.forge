name: SCPF full safety qualification

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: full-safety-main
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Forge
        run: python -m pip install -e ./scpf pillow pyyaml

      - name: Run repository preflight
        run: python scripts/ci_preflight.py --source-sha "$GITHUB_SHA"

      - name: Install SolidCraft
        run: |
          python qualification/setup_solidcraft.py \
            --destination "$RUNNER_TEMP/solidcraft" \
            --github-path "$GITHUB_PATH"

      - name: Install all reference environments
        run: |
          python qualification/setup_references.py \
            --build123d-venv "$RUNNER_TEMP/build123d-venv" \
            --github-env "$GITHUB_ENV"

      - name: Run complete Q1-Q6 safety gate
        env:
          SOLIDCRAFT_GPU: cpu
        run: |
          python scripts/verification_gate.py \
            --gate full-q1-q6 \
            --out output/gate \
            --source-sha "$GITHUB_SHA" \
            --build-out output/build \
            --scope main \
            --source-ref main \
            --workflow-run-id "$GITHUB_RUN_ID"

      - name: Verify complete technical baseline
        run: |
          python scripts/generated_output.py verify-build \
            --root output/build \
            --source-commit "$GITHUB_SHA" \
            --require-complete

      - name: Publish build/main
        id: publish_build
        run: |
          python scripts/publish_generated.py replace-dir \
            --branch build \
            --source output/build \
            --destination main \
            --source-ref main \
            --expected-source "$GITHUB_SHA" \
            --message "Publish full build/main at $GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Record immutable release evidence
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("output/release-evidence.json").write_text(
              json.dumps({
                  "source_commit": os.environ["GITHUB_SHA"],
                  "build_commit": "${{ steps.publish_build.outputs.commit }}",
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build and publish stable site
        run: |
          build_commit="${{ steps.publish_build.outputs.commit }}"
          python scripts/generated_output.py materialize-site-evidence \
            --build-root output/build \
            --destination output/evidence
          python site/build.py \
            --out output/site \
            --source-sha "$GITHUB_SHA" \
            --native output/evidence/native \
            --references output/evidence/references \
            --diagram-root output/evidence/diagrams \
            --build-manifest output/build/build.json \
            --build-commit "$build_commit" \
            --build-scope main
          python site/test_site.py \
            output/site "$GITHUB_SHA" \
            --build-commit="$build_commit" \
            --require-native --require-references
          python site/provenance.py write-build \
            --out output/site/provenance.json \
            --stage stable \
            --source-ref main \
            --source-commit "$GITHUB_SHA" \
            --build-commit "$build_commit" \
            --build-manifest output/build/build.json \
            --workflow-run-id "$GITHUB_RUN_ID"
          python scripts/publish_generated.py replace-stable-pages \
            --branch gh-pages \
            --source output/site \
            --source-ref main \
            --expected-source "$GITHUB_SHA" \
            --message "Publish full qualified site at $GITHUB_SHA"

      - name: Upload safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scpf-qualification-${{ github.sha }}
          path: |
            output/gate
            output/build
            output/site
            output/release-evidence.json
          if-no-files-found: warn
          retention-days: 14
