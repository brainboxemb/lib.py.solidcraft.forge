name: Forge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, dev-cad, dev-ci]

permissions:
  contents: read

jobs:
  cad_ci_pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    concurrency:
      group: forge-pr-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Run exact released CAD CI stack
        uses: brainboxemb/tool.cad.ci@4c6bb8b35009ef5008bd99134cf84b59fddc0b8a
        with:
          source_sha: ${{ github.event.pull_request.head.sha }}
          base_sha: ${{ github.event.pull_request.base.sha }}
          full_run: ${{ github.event.pull_request.base.ref == 'main' && (github.event.pull_request.head.ref == 'dev-cad' || github.event.pull_request.head.ref == 'dev-ci' || github.event.pull_request.head.ref == 'promote/dev-cad' || github.event.pull_request.head.ref == 'promote/dev-ci') }}
          github_token: ${{ github.token }}

  cad_ci_push:
    if: github.event_name == 'push'
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    concurrency:
      group: forge-push-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Resolve durable source scope
        id: lane
        env:
          SOURCE_SCOPE: ${{ github.ref_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          case "$SOURCE_SCOPE" in
            main)
              echo "scope=main" >> "$GITHUB_OUTPUT"
              echo "scope_exists=true" >> "$GITHUB_OUTPUT"
              echo "full_run=false" >> "$GITHUB_OUTPUT"
              echo "base_sha=$EVENT_BEFORE" >> "$GITHUB_OUTPUT"
              ;;
            dev-cad|dev-ci)
              echo "scope=$SOURCE_SCOPE" >> "$GITHUB_OUTPUT"
              probe="$(mktemp -d)"
              git -C "$probe" init --quiet
              git -C "$probe" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
              if git -C "$probe" fetch --quiet --depth=1 origin build &&
                 git -C "$probe" cat-file -e "FETCH_HEAD:$SOURCE_SCOPE/build.json" 2>/dev/null; then
                git -C "$probe" show "FETCH_HEAD:$SOURCE_SCOPE/build.json" > "$probe/build.json"
                BASE_SHA="$(
                  python -c 'import json,re,sys; from pathlib import Path; source=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")).get("source_commit"); print(source) if isinstance(source,str) and re.fullmatch(r"[0-9a-f]{40}", source) else sys.exit("named durable scope has invalid source_commit")' "$probe/build.json"
                )"
                echo "scope_exists=true" >> "$GITHUB_OUTPUT"
                echo "full_run=false" >> "$GITHUB_OUTPUT"
                echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
              else
                echo "scope_exists=false" >> "$GITHUB_OUTPUT"
                echo "full_run=true" >> "$GITHUB_OUTPUT"
                echo "base_sha=$EVENT_BEFORE" >> "$GITHUB_OUTPUT"
              fi
              rm -rf "$probe"
              ;;
            *)
              echo "unsupported durable source branch: $SOURCE_SCOPE" >&2
              exit 2
              ;;
          esac

      - name: Run exact released CAD CI stack
        uses: brainboxemb/tool.cad.ci@4c6bb8b35009ef5008bd99134cf84b59fddc0b8a
        with:
          source_sha: ${{ github.sha }}
          base_sha: ${{ steps.lane.outputs.base_sha }}
          full_run: ${{ steps.lane.outputs.full_run }}
          github_token: ${{ github.token }}

      - name: Fetch current durable build branch
        run: >-
          python -m cad_ci_tool build fetch
          --repo .
          --out generated-build

      - name: Prepare complete durable scope
        env:
          BASE_SHA: ${{ steps.lane.outputs.base_sha }}
          SOURCE_SHA: ${{ github.sha }}
          SCOPE: ${{ steps.lane.outputs.scope }}
          SCOPE_EXISTS: ${{ steps.lane.outputs.scope_exists }}
        run: |
          if [ "$SCOPE" = "main" ]; then
            python -m cad_ci_tool build update-main \
              --repo . \
              --candidate-root build \
              --main generated-build/main \
              --out prepared-scope \
              --source-commit "$SOURCE_SHA" \
              --base "$BASE_SHA" \
              --head "$SOURCE_SHA"
          elif [ "$SCOPE_EXISTS" = "true" ]; then
            python -m cad_ci_tool build update-named \
              --repo . \
              --candidate-root build \
              --named "generated-build/$SCOPE" \
              --name "$SCOPE" \
              --out prepared-scope \
              --source-commit "$SOURCE_SHA" \
              --base "$BASE_SHA" \
              --head "$SOURCE_SHA"
          else
            python -m cad_ci_tool build prepare-named \
              --repo . \
              --candidate-root build \
              --name "$SCOPE" \
              --out prepared-scope \
              --source-commit "$SOURCE_SHA"
          fi

      - name: Publish complete durable scope
        id: durable_build
        env:
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          SCOPE: ${{ steps.lane.outputs.scope }}
        run: |
          if [ "$SCOPE" = "main" ]; then
            scope_args=(--scope main)
          else
            scope_args=(--scope named --scope-name "$SCOPE")
          fi
          BUILD_COMMIT="$(
            python -m cad_ci_tool publish build \
              --repo . \
              --candidate prepared-scope \
              "${scope_args[@]}" \
              --message "build: $SCOPE $SOURCE_SHA" \
              --source-ref "$SOURCE_REF" \
              --expected-source "$SOURCE_SHA"
          )"
          test -n "$BUILD_COMMIT"
          echo "commit=$BUILD_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Build Forge Pages for source scope
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILD_COMMIT: ${{ steps.durable_build.outputs.commit }}
          SCOPE: ${{ steps.lane.outputs.scope }}
        run: |
          python site/build.py \
            --out generated-site \
            --source-sha "$SOURCE_SHA" \
            --build-evidence prepared-scope \
            --build-scope "$SCOPE" \
            --build-commit "$BUILD_COMMIT"
          test -s generated-site/provenance.json
          test -s generated-site/verification/manifest.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              Path("generated-site/provenance.json").read_text(
                  encoding="utf-8"
              )
          )
          assert value["source_commit"] == os.environ["SOURCE_SHA"]
          assert value["build_commit"] == os.environ["BUILD_COMMIT"]
          assert value["build_scope"] == os.environ["SCOPE"]
          PY

      - name: Publish Forge Pages for source scope
        env:
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          SCOPE: ${{ steps.lane.outputs.scope }}
        run: |
          if [ "$SCOPE" = "main" ]; then
            page_args=(
              --preserve-subtree dev-cad
              --preserve-subtree dev-ci
            )
          else
            page_args=(--name "$SCOPE")
          fi
          python -m cad_ci_tool publish pages \
            --repo . \
            --site generated-site \
            "${page_args[@]}" \
            --message "pages: $SCOPE $SOURCE_SHA" \
            --source-ref "$SOURCE_REF" \
            --expected-source "$SOURCE_SHA"
