name: Forge

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cad_ci_pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-ci.yml@f357b70599e5b0a6cf39a25de6a70e43a04e85b1
    with:
      upload_build: true
      build_artifact_name: forge-cad-ci-build

  cad_ci_main:
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-ci.yml@f357b70599e5b0a6cf39a25de6a70e43a04e85b1
    with:
      upload_build: true
      build_artifact_name: forge-cad-ci-main-build

  publish_pr_build:
    needs: cad_ci_pr
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.cad_ci_pr.outputs.build_artifact_name != ''
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Forge source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout accepted CAD CI tool
        uses: actions/checkout@v4
        with:
          repository: brainboxemb/tool.cad.ci
          ref: f357b70599e5b0a6cf39a25de6a70e43a04e85b1
          path: .cad-ci-tool

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install accepted CAD CI tool
        run: python -m pip install ./.cad-ci-tool

      - name: Download verified CAD CI output
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.cad_ci_pr.outputs.build_artifact_name }}
          path: candidate-build

      - name: Prepare affected PR build scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cad-ci build prepare-pr \
            --repo . \
            --candidate-root candidate-build \
            --out prepared-build \
            --source-commit "$SOURCE_SHA" \
            --pull-request "$PR_NUMBER" \
            --base "$BASE_SHA" \
            --head "$SOURCE_SHA"

      - name: Publish affected PR build scope
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_REF: ${{ github.event.pull_request.head.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cad-ci publish build \
            --repo . \
            --candidate prepared-build \
            --scope pr \
            --pull-request "$PR_NUMBER" \
            --message "build: PR #$PR_NUMBER affected items" \
            --source-ref "$SOURCE_REF" \
            --expected-source "$SOURCE_SHA"

  publish_main_build:
    needs: cad_ci_main
    if: >-
      github.event_name == 'push' &&
      needs.cad_ci_main.outputs.build_artifact_name != ''
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Forge main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout accepted CAD CI tool
        uses: actions/checkout@v4
        with:
          repository: brainboxemb/tool.cad.ci
          ref: f357b70599e5b0a6cf39a25de6a70e43a04e85b1
          path: .cad-ci-tool

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install accepted CAD CI tool
        run: python -m pip install ./.cad-ci-tool

      - name: Download verified CAD CI output
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.cad_ci_main.outputs.build_artifact_name }}
          path: candidate-build

      - name: Fetch current durable build branch
        run: cad-ci build fetch --repo . --out generated-build

      - name: Prepare affected main build update
        env:
          BASE_SHA: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cad-ci build update-main \
            --repo . \
            --candidate-root candidate-build \
            --main generated-build/main \
            --out prepared-main \
            --source-commit "$SOURCE_SHA" \
            --base "$BASE_SHA" \
            --head "$SOURCE_SHA"

      - name: Publish affected main build update
        env:
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cad-ci publish build \
            --repo . \
            --candidate prepared-main \
            --scope main \
            --message "build: main $SOURCE_SHA affected items" \
            --source-ref "$SOURCE_REF" \
            --expected-source "$SOURCE_SHA"
