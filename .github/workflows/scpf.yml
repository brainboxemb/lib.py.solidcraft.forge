name: Forge

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cad_ci_pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      packages: read
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-pr.yml@9f37be0af5c4076f676b6407857c5905e11a47d6

  cad_ci_main:
    if: github.event_name == 'push'
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    concurrency:
      group: forge-main-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Run exact released CAD CI stack
        uses: brainboxemb/tool.cad.ci@9f37be0af5c4076f676b6407857c5905e11a47d6
        with:
          source_sha: ${{ github.sha }}
          base_sha: ${{ github.event.before }}
          github_token: ${{ github.token }}

      - name: Fetch current durable build branch
        run: >-
          python -m cad_ci_tool build fetch
          --repo .
          --out generated-build

      - name: Prepare affected main build update
        env:
          BASE_SHA: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python -m cad_ci_tool build update-main \
            --repo . \
            --candidate-root build \
            --main generated-build/main \
            --out prepared-main \
            --source-commit "$SOURCE_SHA" \
            --base "$BASE_SHA" \
            --head "$SOURCE_SHA"

      - name: Publish affected main build update
        id: durable_build
        env:
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          BUILD_COMMIT="$(
            python -m cad_ci_tool publish build \
              --repo . \
              --candidate prepared-main \
              --scope main \
              --message "build: main $SOURCE_SHA affected items" \
              --source-ref "$SOURCE_REF" \
              --expected-source "$SOURCE_SHA"
          )"
          test -n "$BUILD_COMMIT"
          echo "commit=$BUILD_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Build stable Forge Pages
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILD_COMMIT: ${{ steps.durable_build.outputs.commit }}
        run: |
          python site/build.py \
            --out generated-site \
            --source-sha "$SOURCE_SHA" \
            --build-main prepared-main \
            --build-commit "$BUILD_COMMIT"
          test -s generated-site/provenance.json
          test -s generated-site/verification/manifest.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              Path("generated-site/provenance.json").read_text(
                  encoding="utf-8"
              )
          )
          assert value["source_commit"] == os.environ["SOURCE_SHA"]
          assert value["build_commit"] == os.environ["BUILD_COMMIT"]
          assert value["build_scope"] == "main"
          PY

      - name: Publish stable Pages
        env:
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python -m cad_ci_tool publish pages \
            --repo . \
            --site generated-site \
            --message "pages: stable $SOURCE_SHA" \
            --source-ref "$SOURCE_REF" \
            --expected-source "$SOURCE_SHA"

  validate_stable_pages_pr:
    needs: cad_ci_pr
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout accepted CAD CI tool
        uses: actions/checkout@v4
        with:
          repository: brainboxemb/tool.cad.ci
          ref: 9f37be0af5c4076f676b6407857c5905e11a47d6
          path: .cad-ci-tool

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install accepted CAD CI tool
        run: python -m pip install ./.cad-ci-tool

      - name: Fetch durable build branch
        id: durable_build
        run: |
          BUILD_COMMIT="$(cad-ci build fetch --repo . --out generated-build)"
          echo "commit=$BUILD_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Resolve complete PR evidence view
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -d "generated-build/pr/$PR_NUMBER" ]; then
            cad-ci build resolve \
              --main generated-build/main \
              --overlay "generated-build/pr/$PR_NUMBER" \
              --out resolved-build-main
          else
            cad-ci build resolve \
              --main generated-build/main \
              --out resolved-build-main
          fi

      - name: Validate complete stable site generation
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_COMMIT: ${{ steps.durable_build.outputs.commit }}
        run: |
          python site/build.py \
            --out generated-site \
            --source-sha "$SOURCE_SHA" \
            --build-main resolved-build-main \
            --build-commit "$BUILD_COMMIT"
          test -s generated-site/provenance.json
          test -s generated-site/verification/manifest.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              Path("generated-site/provenance.json").read_text(
                  encoding="utf-8"
              )
          )
          assert value["source_commit"] == os.environ["SOURCE_SHA"]
          assert value["build_commit"] == os.environ["BUILD_COMMIT"]
          assert value["build_scope"] == "main"
          PY
