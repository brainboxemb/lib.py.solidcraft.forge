name: Forge

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    permissions:
      contents: read
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-plan.yml@e09e86b42ee42c3171b30d031dbb84b939635ad4

  solidcraft_runtime:
    needs: plan
    if: ${{ contains(needs.plan.outputs.plan_json, '"id":"simple-box"') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      environment_json: ${{ steps.metadata.outputs.environment_json }}
    steps:
      - name: Checkout Forge source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve immutable SolidCraft runtime
        id: metadata
        run: |
          python scripts/solidcraft_runtime.py metadata \
            --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check immutable SolidCraft runtime
        id: runtime_status
        run: |
          python scripts/solidcraft_runtime.py status \
            --reference "${{ steps.metadata.outputs.reference }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Docker buildx
        if: steps.runtime_status.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build missing SolidCraft runtime
        if: steps.runtime_status.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: docker/solidcraft_runtime
          file: docker/solidcraft_runtime/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.reference }}
          build-args: |
            PYTHON_IMAGE=${{ steps.metadata.outputs.python_image }}
            SOLIDCRAFT_VERSION=${{ steps.metadata.outputs.solidcraft_version }}
            CAD_VERIFICATION_COMMIT=${{ steps.metadata.outputs.cad_verification_commit }}
          cache-from: type=gha,scope=solidcraft-runtime
          cache-to: type=gha,mode=max,scope=solidcraft-runtime

  cad_ci:
    needs:
      - plan
      - solidcraft_runtime
    if: >-
      ${{ always() &&
          needs.plan.result == 'success' &&
          (needs.solidcraft_runtime.result == 'success' ||
           needs.solidcraft_runtime.result == 'skipped') }}
    permissions:
      contents: read
      packages: read
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-run.yml@e09e86b42ee42c3171b30d031dbb84b939635ad4
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      environment_json: ${{ needs.solidcraft_runtime.result == 'success' && needs.solidcraft_runtime.outputs.environment_json || '{}' }}
