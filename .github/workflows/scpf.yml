name: Forge

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    permissions:
      contents: read
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-plan.yml@e09e86b42ee42c3171b30d031dbb84b939635ad4

  runtime_check:
    needs: plan
    if: ${{ contains(needs.plan.outputs.plan_json, '"kind":"model"') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      environment_json: ${{ steps.metadata.outputs.environment_json }}
    steps:
      - name: Checkout Forge source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve immutable SolidCraft runtime
        id: metadata
        run: |
          python scripts/solidcraft_runtime.py metadata \
            --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require SolidCraft runtime image
        run: |
          python scripts/solidcraft_runtime.py require \
            --reference "${{ steps.metadata.outputs.reference }}"

  cad_ci:
    needs:
      - plan
      - runtime_check
    if: >-
      ${{ always() &&
          needs.plan.result == 'success' &&
          (needs.runtime_check.result == 'success' ||
           needs.runtime_check.result == 'skipped') }}
    permissions:
      contents: read
      packages: read
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-run.yml@e09e86b42ee42c3171b30d031dbb84b939635ad4
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      environment_json: ${{ needs.runtime_check.result == 'success' && needs.runtime_check.outputs.environment_json || '{}' }}
