name: Verify SolidCraft 0.50 reference for #538

on:
  push:
    branches:
      - issue/538-solidcraft-0.50-runtime

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install declared reference module environment
        run: python -m pip install -e modules/solidcraft-reference

      - name: Verify canonical 0.50.0 registry against immutable runtime
        run: |
          set -euo pipefail
          python -m cad_library_solidcraft_reference verify \
            --image ghcr.io/brainboxemb/cad-solidcraft:v0.3.8 \
            --version 0.50.0 \
            --snapshot docs/reference/solidcraft/0.50.0/commands.json
          python -m cad_library_solidcraft_reference verify-describe \
            --image ghcr.io/brainboxemb/cad-solidcraft:v0.3.8 \
            --version 0.50.0 \
            --command config.rule \
            --snapshot docs/reference/solidcraft/0.50.0/describe/config.rule.json
