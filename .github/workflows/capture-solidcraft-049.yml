name: Capture SolidCraft 0.49 reference

# Qualification-only workflow; removed before merge.

on:
  push:
    branches:
      - issue/85-solidcraft-0.49-adoption

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install reference module
        run: python -m pip install ./modules/solidcraft-reference

      - name: Capture exact immutable runtime registry
        run: >-
          python -m cad_library_solidcraft_reference capture
          --image ghcr.io/brainboxemb/cad-solidcraft:v0.3.6
          --version 0.49.0
          --upstream-commit 10e6242c3a94e942c8fc11e78965ef1cd21e4856
          --runtime-release v0.3.6
          --out docs/reference/solidcraft/0.49.0

      - name: Commit canonical reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference/solidcraft/0.49.0
          git diff --cached --exit-code && exit 0
          git commit -m "#85 capture canonical SolidCraft 0.49.0 reference"
          git push origin HEAD:issue/85-solidcraft-0.49-adoption
