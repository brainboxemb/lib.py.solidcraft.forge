name: SCPF affected-case qualification

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Case slug(s), group:<name>, or all"
        required: true
        default: "group:anchors"

permissions:
  contents: read

jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCPF
        run: python -m pip install -e ./scpf pillow

      - name: Read qualified SolidCraft version from Forge
        shell: bash
        run: |
          version="$(python -c 'from scpf.version import TESTED_SOLIDCRAFT_VERSION; print(TESTED_SOLIDCRAFT_VERSION)')"
          echo "SOLIDCRAFT_VERSION=$version" >> "$GITHUB_ENV"
          echo "SolidCraft affected-case target: $version"

      - name: Install official SolidCraft release (checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/tangency-labs/solidcraft/releases/download/v${SOLIDCRAFT_VERSION}"
          archive="solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error "$base/SHA256SUMS.txt" --output SHA256SUMS.txt
          curl --fail --location --retry 3 --silent --show-error "$base/$archive" --output "$archive"
          grep -F " $archive" SHA256SUMS.txt | sha256sum --check
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Run selected Q1-Q6 qualification
        shell: bash
        env:
          SOLIDCRAFT_GPU: cpu
        run: |
          set -euo pipefail
          python qualification/run_affected.py \
            --cases '${{ inputs.cases }}' \
            --out output/affected

      - name: Publish timing summary
        if: always()
        shell: bash
        run: |
          if test -s output/affected/qualification/affected-timings.tsv; then
            echo "### Affected-case timings" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat output/affected/qualification/affected-timings.tsv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload selected qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scpf-affected-${{ github.sha }}
          path: output/affected
          if-no-files-found: warn
          retention-days: 14
