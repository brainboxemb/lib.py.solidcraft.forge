name: SCPF affected-case qualification

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Case slug(s), group expansion is handled by case_selection"
        required: true
        default: "simple-box"

permissions:
  contents: read

jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Forge
        run: python -m pip install -e ./scpf pillow

      - name: Install SolidCraft
        run: |
          python qualification/setup_solidcraft.py \
            --destination "$RUNNER_TEMP/solidcraft" \
            --github-path "$GITHUB_PATH"

      - name: Run selected native gate
        env:
          SOLIDCRAFT_GPU: cpu
        run: |
          python scripts/verification_gate.py \
            --gate affected-q1-q6 \
            --cases "${{ inputs.cases }}" \
            --out output/affected \
            --source-sha "$GITHUB_SHA"

      - name: Upload selected evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scpf-affected-${{ github.sha }}
          path: output/affected
          if-no-files-found: warn
          retention-days: 14
