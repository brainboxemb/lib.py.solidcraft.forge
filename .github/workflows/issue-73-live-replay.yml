name: Issue 73 live replay diagnostic

on:
  push:
    branches: [issue/73-live-replay-investigation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Forge and GUI runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check -e cadlib
          sudo apt-get update
          sudo apt-get install -y xvfb xauth dbus-x11 libxkbcommon-x11-0 libgl1-mesa-dri libglx-mesa0

      - name: Run 0.49 and 0.50 live/headless A/B
        shell: bash
        run: |
          set -euo pipefail

          run_version() {
            local version="$1"
            local digest="$2"
            local port="$3"
            local archive="$RUNNER_TEMP/solidcraft-${version}.tar.gz"
            local runtime="$RUNNER_TEMP/solidcraft-${version}"
            local output="$GITHUB_WORKSPACE/diagnostic-73-${version}"
            local control="$RUNNER_TEMP/control-${version}"
            local gui_log="$GITHUB_WORKSPACE/solidcraft-${version}-gui.log"

            echo "=== SolidCraft ${version} ==="
            curl --fail --location --retry 3 \
              "https://github.com/tangency-labs/solidcraft/releases/download/v${version}/solidcraft-${version}-linux-x86_64.tar.gz" \
              --output "$archive"
            echo "${digest}  ${archive}" | sha256sum --check

            mkdir -p "$runtime"
            tar -xzf "$archive" -C "$runtime"

            local cli
            local gui
            cli="$(find "$runtime" -type f -name solidcraft-cli -print -quit)"
            gui="$(find "$runtime" -type f -name solidcraft -print -quit)"
            test -n "$cli"
            test -n "$gui"
            chmod +x "$cli" "$gui"
            "$cli" --version

            mkdir -p "$control"
            local runtime_dir="$RUNNER_TEMP/xdg-runtime-${version}"
            mkdir -p "$runtime_dir"
            chmod 700 "$runtime_dir"
            export XDG_RUNTIME_DIR="$runtime_dir"
            export SOLIDCRAFT_CONTROL_DIR="$control"
            export SOLIDCRAFT_CONTROL_TOKEN="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
            export WGPU_BACKEND=gl
            export LIBGL_ALWAYS_SOFTWARE=1
            unset WAYLAND_DISPLAY WAYLAND_SOCKET SOLIDCRAFT_WAYLAND

            dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24 -nolisten tcp" "$gui" --control "$port" >"$gui_log" 2>&1 &
            local gui_pid=$!

            local ready=0
            for _ in $(seq 1 120); do
              if test -s "$control/${port}.token"; then
                ready=1
                break
              fi
              if ! kill -0 "$gui_pid" 2>/dev/null; then
                echo "SolidCraft GUI exited before control became ready"
                cat "$gui_log" || true
                return 2
              fi
              sleep 0.5
            done
            if test "$ready" -ne 1; then
              echo "SolidCraft control did not become ready"
              cat "$gui_log" || true
              kill "$gui_pid" 2>/dev/null || true
              wait "$gui_pid" 2>/dev/null || true
              return 2
            fi

            set +e
            timeout 300s python \
              models/sheet-contour-flange-recess/diagnostics/replay_ab.py \
              --solidcraft-cli "$cli" \
              --output "$output" \
              --connect "$port"
            local diagnostic_rc=$?
            set -e

            kill "$gui_pid" 2>/dev/null || true
            wait "$gui_pid" 2>/dev/null || true

            if ! test -s "$output/summary.json"; then
              echo "Diagnostic did not produce summary.json (rc=${diagnostic_rc})"
              cat "$gui_log" || true
              return 2
            fi

            echo "Diagnostic rc: ${diagnostic_rc}"
            cat "$output/summary.json"
            {
              echo "## SolidCraft ${version}"
              echo
              echo '\`\`\`json'
              cat "$output/summary.json"
              echo '\`\`\`'
            } >> "$GITHUB_STEP_SUMMARY"

            rm -rf "$runtime" "$archive" "$control" "$runtime_dir"
          }

          run_version \
            "0.49.0" \
            "1502c98fa554457fc919dfb6ca94a0b570d0c9c0bd1a28baf36fc91adecc2497" \
            "27878"

          run_version \
            "0.50.0" \
            "b0c63f45fe58ab13c40145132b21fdc309f45e294301f1ba525050aa99575920" \
            "27879"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-73-live-replay
          path: |
            diagnostic-73-*/
            solidcraft-*-gui.log
          if-no-files-found: warn
