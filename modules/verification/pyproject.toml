[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "brainboxemb-cad-verification-lib"
version = "0.16.0"
description = "Repository-local CAD/model verification"
requires-python = ">=3.12"
dependencies = ["trimesh>=4,<5", "scipy>=1.12,<2", "Pillow>=11,<13"]

[tool.setuptools.packages.find]
where = ["src"]
