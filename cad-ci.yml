# Forge CI items and repository-wide runtime expectation.
schema: 1

variables:
  FORGE_RUNTIME_IMAGE: "ghcr.io/brainboxemb/cad-solidcraft:v0.3.1"
  REFERENCE_RUNTIME_IMAGE: "ghcr.io/brainboxemb/cad-reference:v0.3.1"
  SOLIDCRAFT_VERSION: "0.42.0"

templates:
  forge-model-declarative:
    kind: model
    needs:
      - forge-package
      - model-verification-batch
    watch:
      item:
        - scpf/**
        - model.yml
        - verification/**
        - tests/**
      repo:
        - scripts/forge_example.py
        - scripts/model_contract_test.py
        - scripts/model_verification_batch.py
    strategy:
      reuse: true
    steps:
      - id: contract_test
        inputs:
          item:
            - scpf/**
            - tests/**
          repo:
            - scripts/forge_example.py
            - scripts/model_contract_test.py
        run: [python, ../../scripts/model_contract_test.py]
      - id: model_verify
        inputs:
          item:
            - scpf/**
            - model.yml
            - verification/**
            - tests/**
          repo:
            - scripts/forge_example.py
            - scripts/model_verify_declarative.py
            - scripts/model_visual.py
            - scpf/scpf/version.py
        run: [python, ../../scripts/model_verification_batch.py, materialize]
        outputs:
          - solidcraft.json
          - model_verify

  forge-reference:
    kind: verification
    needs:
      - reference-verification-batch
    watch:
      item:
        - model.py
        - ../verification/reference_geometry.json
      repo:
        - scripts/forge_example.py
        - scripts/reference_verification_batch.py
    strategy:
      reuse: true
    steps:
      - id: verify_reference
        inputs:
          item:
            - model.py
            - ../verification/reference_geometry.json
          repo:
            - scripts/forge_example.py
            - scripts/reference_verification_batch.py
        run: [python, ../../../scripts/reference_verification_batch.py, materialize]
        outputs:
          - references

  forge-reference-build123d:
    kind: verification
    needs:
      - reference-verification-batch
    watch:
      item:
        - model.py
        - ../verification/reference_geometry.json
      repo:
        - scripts/forge_example.py
        - scripts/reference_verification_batch.py
    strategy:
      reuse: true
    steps:
      - id: verify_reference
        inputs:
          item:
            - model.py
            - ../verification/reference_geometry.json
          repo:
            - scripts/forge_example.py
            - scripts/reference_verification_batch.py
        run: [python, ../../../scripts/reference_verification_batch.py, materialize]
        outputs:
          - references

items:
  - scpf
  - ci/*
  - examples/*
  - examples/*/*
