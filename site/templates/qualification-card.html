<article class="card qualification-card">
  <a href="${case_url}" class="qualification-card-image" aria-label="View ${title}">
    <img src="${preview_url}" alt="${title} current preview" loading="lazy">
  </a>
  <div class="qualification-card-content">
    <p class="eyebrow">${section}</p>
    <h2><a href="${case_url}">${title}</a></h2>
    ${status_line}
    <p>${description}</p>
    <a class="button" href="${case_url}">View current evidence →</a>
  </div>
</article>
