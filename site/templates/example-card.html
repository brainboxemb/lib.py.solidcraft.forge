<article class="card">
  <a href="${example_url}" class="card-image" aria-label="View ${title}">
    <img src="${preview_url}" alt="${title} preview" loading="lazy">
  </a>
  <div class="card-content">
    <p class="eyebrow">${section}</p>
    <h2><a href="${example_url}">${title}</a></h2>
    <p>${description}</p>
    <p class="meta">${command_summary}</p>
    <a class="button" href="${example_url}">View example and engineering documentation →</a>
  </div>
</article>
