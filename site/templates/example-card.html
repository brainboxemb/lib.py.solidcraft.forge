<article class="card">
  <a href="examples/${slug}/" class="card-image" aria-label="View ${title}">
    <img src="examples/${slug}/${preview_path}" alt="${title} preview" loading="lazy">
  </a>
  <div class="card-content">
    <p class="eyebrow">${section}</p>
    <h2><a href="examples/${slug}/">${title}</a></h2>
    <p>${description}</p>
    <div class="tags">${concept_tags}</div>
    <p class="meta">${command_summary}</p>
    <a class="button" href="examples/${slug}/">View example and verification intent →</a>
  </div>
</article>
