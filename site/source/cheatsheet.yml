schema: 1
groups:
  - heading: Model classes
    items:
      - title: "class Example: ... build(self)"
        description: "Write a Python model. No main() or show() is required."
        snippet: |
          class SimpleBox:
              def build(self):
                  return Box(40, 30, 10)
        example: simple-box
      - title: Model parameters
        description: "Numeric model fields become named SolidCraft parameters."
        snippet: |
          length = 40.0
          Box(self.length, 30, 10)
        example: simple-box

  - heading: Shapes and sketches
    items:
      - title: "Box(length, width, height, *, anchor=CENTER)"
        description: "Native Box centred on XYZ by default; choose anchor=BOTTOM for a bottom-face datum at Z=0."
        snippet: "Box(40, 30, 10)"
        example: simple-box
      - title: "Rectangle2D(width, depth)"
        description: "Planar XY profile authored inside a Sketch."
        snippet: |
          with Sketch(plane='XY') as sketch:
              Rectangle2D(100, 60)
        example: anchored-holes
      - title: "Circle2D(d=...)"
        description: "A round 2D profile authored inside a Sketch."
        snippet: |
          with Sketch(plane='XY') as sketch:
              Circle2D(d=8)
        example:
      - title: "Polygon2D(points, plane=...)"
        description: "A closed profile on XY, XZ or YZ."
        snippet: "Polygon2D([(0,0), (40,0), (0,30)], plane='XZ')"
        example:
      - title: "Cylinder(d=..., h=..., axis=..., anchor=CENTER)"
        description: "Native cylinder centred by default; choose an axial anchor such as BOTTOM or LEFT when that end should define the datum."
        snippet: "Cylinder(d=24, h=14, axis=Axis.X, anchor=LEFT)"
        example:
      - title: "Sphere(radius, *, anchor=CENTER)"
        description: "Native sphere centred by default; cardinal anchors select tangent datums."
        snippet: "Sphere(12, anchor=LEFT)"
        example:

  - heading: Sheet metal
    items:
      - title: "Sketch.sheet_metal(...)"
        description: "Create a new native flat sheet body from one closed Sketch and define its shared material rule."
        snippet: "sheet = sketch.sheet_metal(thickness=2, bend_radius=2, k_factor=0.5)"
        example:
      - title: "Shape.fold(...)"
        description: "Fold existing sheet material along one straight line; material values come from the active sheet rule."
        snippet: "sheet = sheet.fold(line=((20,-20,0),(20,20,0)), angle=90, fixed=(-30,0,0))"
        example:
      - title: "Shape.flange(...)"
        description: "Grow a native flange from one or more fixed existing-sheet edge picks."
        snippet: "sheet = sheet.flange(edges=[(40,0,2)], height=20, angle=90)"
        example:
      - title: "Shape.contour_flange(...)"
        description: "Create a new native sheet body from a finished connected open Sketch chain."
        snippet: "sheet = contour.contour_flange(distance=50, thickness=2.5, bend_radius=2.5)"
        example:
      - title: "Shape.hem(...)"
        description: "Fold an existing sheet edge back while inheriting the active material rule."
        snippet: "sheet = sheet.hem(edges=[(40,0,2)], length=12, gap=4)"
        example:
      - title: "Shape.path_flange(...)"
        description: "Add a native flange to an existing edge using a finished line-only open Sketch path."
        snippet: "sheet = sheet.path_flange(edge=(40,0,2), path=path, radius=3)"
        example:
      - title: "Shape.perforate(...)"
        description: "Apply a native whole-sheet manufacturing perforation field without repeated solid hole cuts."
        snippet: "sheet = sheet.perforate(diameter=5, pitch=10, margin=5, pattern='square')"
        example: sheet-perforate

  - heading: Features and placement
    items:
      - title: "sketch.extrude(distance)"
        description: "Extrude an explicitly authored Sketch into editable native solid history."
        snippet: |
          with Sketch(plane='XY') as sketch:
              Rectangle2D(80, 50)
          plate = sketch.extrude(8)
        example: anchored-holes
      - title: "sketch.extrude(..., profiles=[...])"
        description: "Extrude or cut only the closed Sketch regions selected by fixed sketch-local points."
        snippet: "cut = sketch.extrude(Depth.THROUGH_ALL, profiles=[(-30, 0), (30, 0)], exact_regions=True)"
        example:
      - title: "Sketch.rectangular_pattern(...)"
        description: "Repeat a profile or earlier Sketch result as a native rectangular sketch pattern."
        snippet: "row = sketch.rectangular_pattern(seed, count=4, spacing=25, direction=Axis.X)"
        example:
      - title: "Sketch.mirror(...)"
        description: "Mirror a profile, pattern result or earlier mirror result over the Sketch X or Y axis."
        snippet: "sketch.mirror(row, axis=Axis.Y)"
        example:
      - title: "Hole(d=..., depth=...)"
        description: "A native hole. THROUGH_ALL follows the target body."
        snippet: "Hole(d=8, depth=Depth.THROUGH_ALL)"
        example: anchored-holes
      - title: "shape.rectangular_pattern(...)"
        description: "Repeat an already-applied native feature in one or two linear directions."
        snippet: "plate.rectangular_pattern(hole, count=4, spacing=20, direction=Axis.X)"
        example:
      - title: "shape.circular_pattern(...)"
        description: "Repeat an already-applied native feature around a fixed axis."
        snippet: "plate.circular_pattern(hole, count=6, axis=Axis.Z)"
        example:
      - title: "shape.at(target, anchor=..., child=...)"
        description: "Place a direct CSG shape anchor on another shape anchor; CENTER-to-CENTER is supported first."
        snippet: "Cylinder(d=8, h=50, axis=Axis.X).at(body)"
        example: primitive-csg
      - title: "shape.on(target, face=...)"
        description: "Express feature placement with the shared cardinal Faces vocabulary; TOP/BOTTOM placement is currently qualified."
        snippet: "Hole(d=8, depth=Depth.THROUGH_ALL).on(plate, face=Faces.TOP)"
        example: anchored-holes
      - title: "TOP + LEFT / BOTTOM + RIGHT"
        description: "Combine cardinal directions to identify one edge of an axis-aligned rectangular solid."
        snippet: "body.fillet(2, edges=[BOTTOM + LEFT, BOTTOM + RIGHT])"
        example:
      - title: "Box(...).at(..., anchor=...)"
        description: "Place a native Box by a face, edge or corner anchor without creating a Sketch."
        snippet: "Box(80, 50, 12).at(0, 0, 0, anchor=FRONT + BOTTOM)"
        example:
      - title: "Edges.from_faces(...)"
        description: "Select the complete native boundary of one or more cardinal Faces without supplying XYZ edge picks."
        snippet: "body.chamfer(1.5, edges=Edges.from_faces(Faces.FRONT, Faces.BACK))"
        example: topology-face-boundary-xz
      - title: "shape.fillet(...)"
        description: "Round selected edges of a feature-based body."
        snippet: "body.fillet(2, edges=Edges.VERTICAL)"
        example:
      - title: "shape.chamfer(...)"
        description: "Bevel selected edges; add distance2 for SolidCraft's native asymmetric two-distance chamfer."
        snippet: "body.chamfer(0.18, distance2=0.65, edges=Edges.VERTICAL)"
        example: asymmetric-chamfer
      - title: "shape.shell(...)"
        description: "Create an open-sided shell (supported feature trees only)."
        snippet: "Box(80, 50, 30).shell(2, open=Faces.TOP)"
        example:
      - title: "a + b / a - b / a & b"
        description: "Join, cut or intersect supported shapes; operation support depends on the shape types."
        snippet: "body + Hole(d=8).at(0, 0, 10)"
        example:

  - heading: Reusable components
    items:
      - title: "copy(placement=Placement(...))"
        description: "Create another occurrence of the same component definition at a declared pose."
        snippet: "second = first.copy(placement=Placement(x=40))"
        example: components
      - title: "model.attach(...)"
        description: "Fix one reusable component to another through explicit attachment references."
        snippet: "right = Block().attach(left, parent=Anchor.RIGHT, child=Anchor.LEFT)"
        example: components
      - title: "attach(offset=(u, v))"
        description: "Keep an in-plane attachment offset associative; parameter expressions become native planar-joint values."
        snippet: "part.attach(base, parent=Anchor.FRONT_TOP_LEFT, child=mount, offset=(0, -wall + 12))"
        example: components
      - title: "attach(kind=\"revolute\", ...)"
        description: "Create a native bounded revolute relationship while reusing the normal attachment-reference model."
        snippet: "moving.attach(fixed, parent=\"hinge_axis\", child=\"hinge_axis\", kind=\"revolute\", value=60, limits=(0, 180), name=\"Hinge\")"
        example: revolute-joint
      - title: "assembly.with_exploded_view(...)"
        description: "Store a native automatic or explicit exploded presentation without changing normal occurrence placements."
        snippet: "assembly.with_exploded_view('Service', scale=1.25).show_exploded('Service')"
        example: exploded-views
      - title: "assembly.show_assembled()"
        description: "Return presentation to the normal assembled occurrence placements."
        snippet: "assembly.show_assembled()"
        example: exploded-views
      - title: "assembly.with_anchor(...) / anchor(...)"
        description: "Expose a semantic attachment datum owned by an assembly without adding application-specific anchors to a generic component."
        snippet: |
          frame = (left + right).with_anchor("front_top_left", left, ref)
          parent = frame.anchor("front_top_left")
        example: components
      - title: corner anchors
        description: "Use one of the eight rectangular corner references when attaching components."
        snippet: "marker = Marker().attach(base, parent=Anchor.FRONT_TOP_RIGHT, child=Anchor.BACK_TOP_RIGHT)"
        example: corner-anchor
      - title: AnchorFrame
        description: "Define an oriented local attachment frame. Return it from anchors() when the datum belongs to the reusable component, or pass it directly to attach() when it belongs only to the assembly."
        snippet: |
          mount = AnchorFrame(origin=(0,0,-12), z=(0,1,0), x=(0,0,-1))
          part.attach(base, parent=Anchor.FRONT_TOP_LEFT, child=mount)
        example: custom-anchor
      - title: AnchorTopology
        description: "Keep a named or assembly-local attachment reference on a planar-face edge or one of its endpoints so SolidCraft can follow changing geometry."
        snippet: |
          def anchors(self):
              return {"mount": AnchorTopology(edge=(0,10,5), on=(0,10,10), corner=(0,0,5))}
        example: custom-anchor
      - title: "Placement(rotation=(axis, degrees))"
        description: "Give a component occurrence one absolute axis-angle orientation."
        snippet: "second = first.copy(placement=Placement(x=40, rotation=(Z, 180)))"
        example:

  - heading: Drawings
    items:
      - title: "model.with_drawing(...)"
        description: "Attach a native SolidCraft engineering drawing to the completed design; ISO A4 landscape is the default."
        snippet: "part.with_drawing(name='Sample Plate Drawing')"
        example: sample-plate-drawing
      - title: "DrawingView(at=..., scale=..., visual_style=...)"
        description: "Place one native standard view in paper millimetres; 'shaded' is the qualified pictorial override while omission keeps the normal line view."
        snippet: "DrawingView(at=(220, 128), scale='1:1', visual_style='shaded')"
        example: sample-plate-drawing
      - title: "DrawingDimension.faces(...)"
        description: "Dimension two real planar model faces; prefer this for overall sizes when fillets remove corners."
        snippet: "DrawingDimension.faces('front', (-40,0,4), (40,0,4), direction='horizontal', offset_mm=12)"
        example: sample-plate-drawing
      - title: "DrawingDimension.linear(...)"
        description: "Create a native linear dimension between two model-space point/corner picks."
        snippet: "DrawingDimension.linear('front', (0,0,0), (20,0,0), direction='horizontal')"
        example: sample-plate-drawing
      - title: "DrawingDimension.radial(...)"
        description: "Create a native radial/diameter dimension from a circular model-edge pick; override_text may form a hole callout."
        snippet: "DrawingDimension.radial('top', (-25.17,2.83,8), diameter=True, override_text='2× {value} THRU')"
        example: sample-plate-drawing
      - title: "DrawingNote(...)"
        description: "Add native sheet notes at an explicit paper position."
        snippet: "DrawingNote('NOTES\\n1. ALL DIMENSIONS IN MM.', at=(156,88), cap_mm=2.5)"
        example: sample-plate-drawing
      - title: "DrawingRevision(...)"
        description: "Add one native revision row and drive matching title-block revision fields."
        snippet: "DrawingRevision(revision='A', description='Initial drawing', designer='Forge', checker='CI')"
        example: sample-plate-drawing
      - title: "properties=... / title_block=..."
        description: "Populate native drawing properties and explicit cells in the selected SolidCraft title-block template."
        snippet: "properties={'part_number':'BRK-001'}, title_block={'title':'Bracket','material':'PETG'}"
        example: sample-plate-drawing
      - title: "template='iso-a3-part'"
        description: "Select native ISO A3 explicitly when the documented part needs more sheet area; Forge keeps it landscape."
        snippet: "part.with_drawing(name='Large part', template='iso-a3-part')"
        example: sample-plate-drawing
      - title: "Native PDF + PNG + inspect JSON"
        description: "builder-scpf publishes vector PDF, static native sheet PNG and final native drawing.inspect evidence; Pages loads only the PNG."
        snippet: "drawings/Sample-Plate-Drawing.{pdf,png,json}"
        example: sample-plate-drawing

  - heading: Compile and inspect
    items:
      - title: "python -m scpf ... --out"
        description: "Compile a model to SolidCraft command JSON; no SolidCraft app needed."
        snippet: "python -m scpf examples/simple-box/scpf/model.py --out output/box.json"
        example: simple-box
      - title: "python -m scpf replay ..."
        description: "Send existing command JSON to an open SolidCraft session; does not recompile."
        snippet: "python -m scpf replay output/box.json"
        example:
      - title: "python -m scpf ... --connect"
        description: "Execute a model in an open SolidCraft GUI document."
        snippet: "python -m scpf examples/simple-box/scpf/model.py --connect"
        example:

  - heading: Display appearance
    items:
      - title: 'shape.with_appearance("#RRGGBB")'
        description: "Give the finished body a visual color without changing material/BOM semantics."
        snippet: 'body.with_appearance("#FFD21A")'
        example: appearance-color

  - heading: Configuration tables
    items:
      - title: "model.configure(active=..., columns=..., rows=...)"
        description: "Attach one editable native configuration table. Parameter rows select concrete values; they do not define parameter-to-parameter expressions."
        snippet: |
          model.configure(
              active="Medium",
              columns=(self.width, child.feature("panel_pin")),
              rows={"Medium": ("80 mm", True),
                    "Large": ("100 mm", False)})
        example: configuration-child-feature
      - title: "feature(name, suppressed=...)"
        description: "Give exactly one authored CAD history operation stable Forge identity and an optional initial suppressed state."
        snippet: |
          with feature("panel_pin", suppressed=True):
              body = body - Hole(d=5).at(0, 0, 12)
        example: configuration-child-feature
      - title: "occurrence.feature(name)"
        description: "Reference one definition-level named child feature directly from the final configuration."
        snippet: |
          model.configure(
              active="Small",
              columns=(coupler.feature("panel_pin"),),
              rows={"Small": (True,), "Large": (False,)})
        example: configuration-child-feature

  - heading: Symbolic CAD math
    items:
      - title: "cadmath.min / max / sqrt / abs / round / floor / atan"
        description: "Keep non-linear and quantized derived dimensions native and configuration-driven."
        snippet: |
          g = cadmath.min(self.rounding, self.wall / 2 - 0.05)
          tip = cadmath.sqrt((self.radius - g) ** 2 - (self.radius - self.wall + g) ** 2)
        example: configuration-symbolic-math

  - heading: Shifted native revolve
    items:
      - title: "AxisLine(direction, origin=...)"
        description: "Author one shifted/custom native axis with parameter-driven XYZ origin."
        snippet: |
          axis = AxisLine(Axis.Y, origin=(self.pin_x, 0, self.pin_z))
          cut = profile.revolve(axis=axis)
        example: shifted-axis-revolve
