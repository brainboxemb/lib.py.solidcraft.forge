section: features
title: Native circular feature pattern
tagline: One source cut is repeated by a native circular History pattern
description: >
  A plate receives one source through-hole cut and SolidCraft repeats that feature around a pitch circle as one editable circular pattern.
parameters: 100 × 100 × 6 mm plate; six Ø8 holes on 60 mm PCD
stages:
  - Create the plate and one BoltHole sketch
  - Apply one source through-hole cut
  - Repeat that cut with one native circular feature pattern
concepts:
  - Circle2D
  - through-all cut
  - circular feature pattern
  - editable parameters
verification:
  summary: >
    Verifies one source hole cut repeated by native circular feature history and
    driven by editable bolt-count and pitch-circle parameters.
  proves:
    - The plate envelope, volume and cylindrical cut surfaces match the requested pattern.
    - The BoltHole sketch remains solved and native pattern history is preserved.
    - Changing the bolt count rebuilds the native circular pattern rather than expanding Python copies.
  saved_design: >
    The saved design changes the bolt count while preserving the pitch-circle
    parameter and verifies the rebuilt pattern geometry and history.
