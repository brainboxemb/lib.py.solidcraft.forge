section: anchors
title: Face anchor follows parent geometry
tagline: RIGHT-to-LEFT attachment follows an editable parent width
description: >
  A Block attached to the Base RIGHT face remains tied to native parent topology when the parent width changes.
parameters: Base width 40 mm; Base depth 30 mm; Block 20 × 20 × 10 mm
stages:
  - Create the parameterized Base
  - Attach Block from Base RIGHT to child LEFT
  - Keep the face anchor associative to parent width
concepts:
  - Anchor.RIGHT
  - Anchor.LEFT
  - component attachment
  - saved-design associativity
verification:
  summary: >
    Verifies a face-to-face component attachment that follows an editable parent
    width through native topology.
  proves:
    - Base and attached Block occupy the expected baseline envelopes.
    - The Block remains attached to the Base RIGHT face rather than a fixed X coordinate.
    - Increasing the parent width moves the Block to the resized face.
  saved_design: >
    The saved design changes the Base width and verifies the attached Block at
    the new face location.
