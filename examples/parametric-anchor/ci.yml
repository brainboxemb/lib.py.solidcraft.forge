# One Forge example is one CI item. The integration step writes the cheap
# case evidence; the native step resumes the same staged output at compile.
id: parametric-anchor
kind: example
watch:
  - examples/parametric-anchor/**
  - scpf/scpf/**
  - qualification/case_runner.py
  - qualification/cases.py
  - qualification/native_cases.py
  - qualification/native_validation.py
  - qualification/visual_validation.py
  - scripts/example_ci.py
strategy:
  reuse: true
steps:
  - id: integration
    run: [python, ../../scripts/example_ci.py, integration]
    outputs:
      - case/stages/parametric-anchor/01-q1.json
      - case/stages/parametric-anchor/02-q2.json
      - case/qualification/case-evidence/q1/parametric-anchor.txt
      - case/qualification/case-evidence/q2/parametric-anchor.txt
  - id: native
    run: [python, ../../scripts/example_ci.py, native]
    outputs:
      - case/native/parametric-anchor
      - case/stages/parametric-anchor/13-gate.json
