# One Forge example is one CI item. The integration step writes cheap case
# evidence through command compilation; the native step resumes at replay.
id: parameter-scope
kind: example
watch:
  - examples/parameter-scope/**
  - scpf/scpf/**
  - qualification/case_runner.py
  - qualification/cases.py
  - qualification/native_cases.py
  - qualification/native_validation.py
  - qualification/visual_validation.py
  - scripts/example_ci.py
strategy:
  reuse: true
steps:
  - id: integration
    run: [python, ../../scripts/example_ci.py, integration]
    outputs:
      - case/parameter-scope.json
      - case/stages/parameter-scope/01-q1.json
      - case/stages/parameter-scope/02-q2.json
      - case/stages/parameter-scope/03-compile.json
      - case/qualification/case-evidence/q1/parameter-scope.txt
      - case/qualification/case-evidence/q2/parameter-scope.txt
  - id: native
    run: [python, ../../scripts/example_ci.py, native]
    outputs:
      - case/native/parameter-scope
      - case/stages/parameter-scope/13-gate.json
