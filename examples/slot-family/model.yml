verification:
  summary: >
    Verifies all five native Slot construction methods together in one explicit
    solved sketch and one through cut.
  proves:
    - The plate remains one body with the expected material removal.
    - The Slot family sketch contains five closed profiles and the expected curve count.
    - Resulting planar/cylindrical face counts match the five slot constructions.
    - Native history preserves one Box, one named Slot sketch and one extrusion cut.
