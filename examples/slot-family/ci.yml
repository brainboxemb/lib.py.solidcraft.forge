# SolidCraft model verification for slot-family.
id: slot-family
process: false
kind: model
needs:
  - forge-tool
watch:
  - examples/slot-family/scpf/**
  - examples/slot-family/model.yml
  - examples/slot-family/verification/**
  - scripts/forge_example.py
  - scripts/model_verify.py
strategy:
  reuse: true
steps:
  - id: model_verify
    inputs:
      - examples/slot-family/scpf/**
      - examples/slot-family/model.yml
      - examples/slot-family/verification/**
      - scripts/forge_example.py
      - scripts/model_verify.py
      - scpf/scpf/version.py
    run: [python, ../../scripts/model_verify.py]
    outputs:
      - solidcraft.json
      - model_verify
