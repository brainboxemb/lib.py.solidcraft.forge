# SolidCraft model verification for assembly-owned-anchor.
id: assembly-owned-anchor
process: false
kind: model
needs:
  - forge-package
  - model-verification-batch
watch:
  - examples/assembly-owned-anchor/scpf/**
  - examples/assembly-owned-anchor/model.yml
  - examples/assembly-owned-anchor/verification/**
  - scripts/forge_example.py
  - scripts/model_verify_declarative.py
strategy:
  reuse: true
steps:
  - id: model_verify
    inputs:
      - examples/assembly-owned-anchor/scpf/**
      - examples/assembly-owned-anchor/model.yml
      - examples/assembly-owned-anchor/verification/**
      - scripts/forge_example.py
      - scripts/model_verify_declarative.py
      - scpf/scpf/version.py
    run: [python, ../../scripts/model_verification_batch.py, materialize]
    outputs:
      - solidcraft.json
      - model_verify
