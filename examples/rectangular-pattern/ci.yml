# One Forge example is one CI item. The integration step writes the cheap
# case evidence; the native step resumes the same staged output at compile.
id: rectangular-pattern
kind: example
watch:
  - examples/rectangular-pattern/**
  - scpf/scpf/**
  - qualification/case_runner.py
  - qualification/cases.py
  - qualification/native_cases.py
  - qualification/native_validation.py
  - qualification/visual_validation.py
  - scripts/example_ci.py
strategy:
  reuse: true
steps:
  - id: integration
    run: [python, ../../scripts/example_ci.py, integration]
    outputs:
      - case/stages/rectangular-pattern/01-q1.json
      - case/stages/rectangular-pattern/02-q2.json
      - case/qualification/case-evidence/q1/rectangular-pattern.txt
      - case/qualification/case-evidence/q2/rectangular-pattern.txt
  - id: native
    run: [python, ../../scripts/example_ci.py, native]
    outputs:
      - case/native/rectangular-pattern
      - case/stages/rectangular-pattern/13-gate.json
