# SolidCraft model verification for rectangular-pattern.
id: rectangular-pattern
kind: model
needs:
  - forge-tool
watch:
  - examples/rectangular-pattern/scpf/**
  - examples/rectangular-pattern/model.yml
  - examples/rectangular-pattern/verification/**
  - scripts/forge_example.py
  - scripts/model_verify.py
strategy:
  reuse: true
steps:
  - id: model_verify
    inputs:
      - examples/rectangular-pattern/scpf/**
      - examples/rectangular-pattern/model.yml
      - examples/rectangular-pattern/verification/**
      - scripts/forge_example.py
      - scripts/model_verify.py
      - scpf/scpf/version.py
    run: [python, ../../scripts/model_verify.py]
    outputs:
      - solidcraft.json
      - model_verify
