section: features
title: Native rectangular feature pattern
tagline: One Slot cut is repeated by a two-direction native History pattern
description: >
  A plate receives one Slot source cut and SolidCraft repeats that existing feature in a rectangular rows-and-columns pattern.
parameters: 120 × 80 × 4 mm plate; 3 × 2 Slot pattern; 24 × 28 mm pitch
stages:
  - Create the plate and source Slot sketch
  - Cut the source Slot once
  - Repeat the cut with one native rectangular feature pattern
concepts:
  - SlotCenterToCenter2D
  - through cut
  - rectangular feature pattern
  - editable pattern parameters
verification:
  summary: >
    Verifies one source slot cut repeated by a two-direction native rectangular
    feature pattern with editable rows, columns and spacing.
  proves:
    - Baseline volume, face counts and slot sketch state match the requested pattern.
    - Native history keeps one source cut followed by one rectangular pattern feature.
    - Changing the pattern dimensions rebuilds geometry, face counts and mass distribution consistently.
  saved_design: >
    The saved design changes the column count and pitch and verifies the rebuilt
    feature pattern, resulting faces, volume and center of mass.
