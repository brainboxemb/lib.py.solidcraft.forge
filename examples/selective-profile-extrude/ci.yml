# One Forge example is one CI item. The integration step writes cheap case
# evidence through command compilation; the native step resumes at replay.
id: selective-profile-extrude
kind: example
watch:
  - examples/selective-profile-extrude/**
  - scpf/scpf/**
  - qualification/case_runner.py
  - qualification/cases.py
  - qualification/native_cases.py
  - qualification/native_validation.py
  - qualification/visual_validation.py
  - scripts/example_ci.py
strategy:
  reuse: true
steps:
  - id: integration
    run: [python, ../../scripts/example_ci.py, integration]
    outputs:
      - case/selective-profile-extrude.json
      - case/stages/selective-profile-extrude/01-q1.json
      - case/stages/selective-profile-extrude/02-q2.json
      - case/stages/selective-profile-extrude/03-compile.json
      - case/qualification/case-evidence/q1/selective-profile-extrude.txt
      - case/qualification/case-evidence/q2/selective-profile-extrude.txt
  - id: native
    run: [python, ../../scripts/example_ci.py, native]
    outputs:
      - case/native/selective-profile-extrude
      - case/stages/selective-profile-extrude/13-gate.json
