section: associativity
title: Selective Sketch profile extrusion
tagline: One associative pattern keeps all profiles while a cut selects only three
description: >
  A patterned Circle sketch retains four generated profiles while one native extrusion selects only the intended three closed regions.
parameters: 120 × 60 × 5 mm plate; Ø8 holes; 20 mm pattern pitch
stages:
  - Create the plate and one Circle seed
  - Generate the associative four-profile sketch pattern
  - Cut only the selected closed profiles through the plate
concepts:
  - sketch pattern
  - selective profile extrusion
  - exact_regions
  - through-all cut
  - saved-design mutation
verification:
  summary: >
    Verifies that a patterned sketch may retain all generated profiles while an
    extrusion cuts only explicitly selected closed regions.
  proves:
    - Only three of the four patterned circles are removed from the plate.
    - Volume, cylindrical face count and center-of-mass shift match the selected regions.
    - The sketch remains solved and the source pattern stays associative.
  saved_design: >
    The saved design changes hole diameter and pitch and verifies the selected
    three-region cut, resulting volume and X center of mass after rebuild.
