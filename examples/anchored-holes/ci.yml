# SolidCraft model verification for anchored-holes.
id: anchored-holes
kind: model
needs:
  - forge-tool
watch:
  - examples/anchored-holes/scpf/**
  - examples/anchored-holes/model.yml
  - examples/anchored-holes/verification/**
  - scripts/forge_example.py
  - scripts/model_verify.py
strategy:
  reuse: true
steps:
  - id: model_verify
    inputs:
      - examples/anchored-holes/scpf/**
      - examples/anchored-holes/model.yml
      - examples/anchored-holes/verification/**
      - scripts/forge_example.py
      - scripts/model_verify.py
      - scpf/scpf/version.py
    run: [python, ../../scripts/model_verify.py]
    outputs:
      - solidcraft.json
      - model_verify
