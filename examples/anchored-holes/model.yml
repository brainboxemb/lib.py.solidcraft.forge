section: features
title: Face-relative hole with native pattern
tagline: One attached source cut repeated by native rectangular history
description: >
  A rectangular plate with one TOP-face hole source that is cut once and repeated as an editable native rectangular pattern.
parameters: 100 × 60 × 10 mm plate; two Ø8 through holes at 40 mm spacing
stages:
  - Create the rectangular base sketch and extrude the plate
  - Attach one Hole sketch to the TOP face and cut through the plate
  - Repeat the source cut with one native rectangular feature pattern
concepts:
  - Sketch
  - face-relative placement
  - Anchor.TOP
  - through-all cut
  - rectangular feature pattern
verification:
  summary: >
    Verifies one native plate body with a face-attached source cut that is
    repeated by editable rectangular feature history.
  proves:
    - The final plate keeps the expected outer envelope and material volume.
    - Exactly two cylindrical hole surfaces are present.
    - Native history contains the base sketch, source cut and rectangular pattern in order.
