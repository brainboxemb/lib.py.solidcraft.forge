# One Forge example is one CI item. The integration step writes cheap case
# evidence through command compilation; the native step resumes at replay.
id: parametric-attach
kind: example
watch:
  - examples/parametric-attach/**
  - scpf/scpf/**
  - qualification/case_runner.py
  - qualification/cases.py
  - qualification/native_cases.py
  - qualification/native_validation.py
  - qualification/visual_validation.py
  - scripts/example_ci.py
strategy:
  reuse: true
steps:
  - id: integration
    run: [python, ../../scripts/example_ci.py, integration]
    outputs:
      - case/parametric-attach.json
      - case/stages/parametric-attach/01-q1.json
      - case/stages/parametric-attach/02-q2.json
      - case/stages/parametric-attach/03-compile.json
      - case/qualification/case-evidence/q1/parametric-attach.txt
      - case/qualification/case-evidence/q2/parametric-attach.txt
  - id: native
    run: [python, ../../scripts/example_ci.py, native]
    outputs:
      - case/native/parametric-attach
      - case/stages/parametric-attach/13-gate.json
