section: associativity
title: Editable distance between attached components
tagline: Attachment gap remains an editable native relationship parameter
description: >
  A Block is attached to a Base with a symbolic gap so editing the saved SolidCraft design moves the attached component without rerunning Python.
parameters: Base 40 × 30 × 10 mm; Block 20 × 20 × 10 mm; gap 10 mm
stages:
  - Create Base and Block components
  - Attach Block with a symbolic normal gap
  - Preserve gap as an editable native relationship value
concepts:
  - component attachment
  - symbolic gap
  - native relationship parameter
  - saved-design mutation
verification:
  summary: >
    Verifies that attachment gap remains an editable native relationship value
    instead of being baked into a Python placement.
  proves:
    - Base and Block occupy the expected baseline envelopes with the configured gap.
    - Editing only the relationship gap moves the Block while the Base remains unchanged.
  saved_design: >
    The saved design increases the attachment gap and verifies the Block's new
    relationship-driven placement.
