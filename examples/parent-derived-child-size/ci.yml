# Host-side verification for one Forge example.
id: parent-derived-child-size
kind: example
needs:
  - forge-tool
watch:
  - examples/parent-derived-child-size/**
  - qualification/**/*.py
  - qualification/commands/**
  - scripts/tool_verify.py
strategy:
  reuse: true
steps:
  - id: tool_verify
    inputs:
      - examples/parent-derived-child-size/**
      - qualification/**/*.py
      - qualification/commands/**
      - scripts/tool_verify.py
    run: [python, ../../scripts/tool_verify.py]
    outputs:
      - solidcraft.json
