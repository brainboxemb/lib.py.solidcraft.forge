# One Forge example is one CI item. The integration step writes cheap case
# evidence through command compilation; the native step resumes at replay.
id: parent-derived-child-size
kind: example
watch:
  - examples/parent-derived-child-size/**
  - scpf/scpf/**
  - qualification/case_runner.py
  - qualification/cases.py
  - qualification/native_cases.py
  - qualification/native_validation.py
  - qualification/visual_validation.py
  - scripts/example_ci.py
strategy:
  reuse: true
steps:
  - id: integration
    run: [python, ../../scripts/example_ci.py, integration]
    outputs:
      - case/parent-derived-child-size.json
      - case/stages/parent-derived-child-size/01-q1.json
      - case/stages/parent-derived-child-size/02-q2.json
      - case/stages/parent-derived-child-size/03-compile.json
      - case/qualification/case-evidence/q1/parent-derived-child-size.txt
      - case/qualification/case-evidence/q2/parent-derived-child-size.txt
  - id: native
    run: [python, ../../scripts/example_ci.py, native]
    outputs:
      - case/native/parent-derived-child-size
      - case/stages/parent-derived-child-size/13-gate.json
