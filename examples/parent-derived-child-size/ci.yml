# SolidCraft model verification for parent-derived-child-size.
id: parent-derived-child-size
process: false
kind: model
needs:
  - forge-package
watch:
  - examples/parent-derived-child-size/scpf/**
  - examples/parent-derived-child-size/model.yml
  - examples/parent-derived-child-size/verification/**
  - scripts/forge_example.py
  - scripts/model_verify.py
strategy:
  reuse: true
steps:
  - id: model_verify
    inputs:
      - examples/parent-derived-child-size/scpf/**
      - examples/parent-derived-child-size/model.yml
      - examples/parent-derived-child-size/verification/**
      - scripts/forge_example.py
      - scripts/model_verify.py
      - scpf/scpf/version.py
    run: [python, ../../scripts/model_verify.py]
    outputs:
      - solidcraft.json
      - model_verify
