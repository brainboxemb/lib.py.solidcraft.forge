section: parameters
title: Child dimensions derived from parent parameters
tagline: A reusable child keeps half-size expressions from its parent
description: >
  A parent block and child component preserve width and depth expressions so saved-design edits to the parent rebuild both bodies.
parameters: Parent 120 × 80 × 10 mm; child 60 × 40 × 6 mm derived from half width/depth
stages:
  - Publish parent base_width and base_depth parameters
  - Create the parent body from those parameters
  - Create the child from half-width and half-depth expressions
concepts:
  - parent parameters
  - derived expressions
  - child component parameters
  - saved-design rebuild
verification:
  summary: >
    Verifies that child dimensions derived from parent parameters remain native
    expressions and rebuild when the parent changes.
  proves:
    - Parent and derived child have the expected baseline envelopes.
    - Parent width/depth values remain editable native parameters.
    - Changing the parent dimensions updates the child's half-width and half-depth geometry.
  saved_design: >
    The saved design enlarges the parent and verifies the child rebuilding from
    the same derived expressions.
