section: fundamentals
title: Primitive CSG
tagline: Direct primitives and Boolean operators form one native CSG result
description: >
  Sphere, Box and X-axis Cylinder primitives are translated and combined with union, subtraction and intersection independently of feature-history modelling.
parameters: Sphere R20; 30 mm Box extension; Ø8 X-axis bore; 50 mm clipping Box
stages:
  - Create and union the Sphere and translated Box
  - Subtract the centered X-axis Cylinder bore
  - Intersect the result with the clipping Box
concepts:
  - Sphere
  - Box
  - Cylinder
  - Boolean union
  - Boolean cut
  - Boolean intersect
verification:
  summary: >
    Verifies direct native primitives, transforms and Boolean CSG independently
    of sketch/feature-history workflows.
  proves:
    - The final Boolean result is one body with the expected envelope.
    - The result retains both spherical and cylindrical surface types from the primitive operations.
