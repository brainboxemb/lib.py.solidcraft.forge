# One Forge example is one CI item. The integration step writes cheap case
# evidence through command compilation; the native step resumes at replay.
id: primitive-csg
kind: example
watch:
  - examples/primitive-csg/**
  - scpf/scpf/**
  - qualification/case_runner.py
  - qualification/cases.py
  - qualification/native_cases.py
  - qualification/native_validation.py
  - qualification/visual_validation.py
  - scripts/example_ci.py
strategy:
  reuse: true
steps:
  - id: integration
    run: [python, ../../scripts/example_ci.py, integration]
    outputs:
      - case/primitive-csg.json
      - case/stages/primitive-csg/01-q1.json
      - case/stages/primitive-csg/02-q2.json
      - case/stages/primitive-csg/03-compile.json
      - case/qualification/case-evidence/q1/primitive-csg.txt
      - case/qualification/case-evidence/q2/primitive-csg.txt
  - id: native
    run: [python, ../../scripts/example_ci.py, native]
    outputs:
      - case/native/primitive-csg
      - case/stages/primitive-csg/13-gate.json
