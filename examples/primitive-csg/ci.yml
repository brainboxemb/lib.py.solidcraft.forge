# Host-side verification for one Forge example.
id: primitive-csg
kind: example
needs:
  - forge-tool
watch:
  - examples/primitive-csg/**
  - scripts/tool_verify.py
strategy:
  reuse: true
steps:
  - id: tool_verify
    inputs:
      - examples/primitive-csg/**
      - scripts/tool_verify.py
    run: [python, ../../scripts/tool_verify.py]
    outputs:
      - solidcraft.json
