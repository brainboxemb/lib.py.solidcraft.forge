# One Forge example is one CI item. The integration step writes the cheap
# case evidence; the native step resumes the same staged output at compile.
id: anchor-topology-mutation
kind: example
watch:
  - examples/anchor-topology-mutation/**
  - scpf/scpf/**
  - qualification/case_runner.py
  - qualification/cases.py
  - qualification/native_cases.py
  - qualification/native_validation.py
  - qualification/visual_validation.py
  - scripts/example_ci.py
strategy:
  reuse: true
steps:
  - id: integration
    run: [python, ../../scripts/example_ci.py, integration]
    outputs:
      - case/stages/anchor-topology-mutation/01-q1.json
      - case/stages/anchor-topology-mutation/02-q2.json
      - case/qualification/case-evidence/q1/anchor-topology-mutation.txt
      - case/qualification/case-evidence/q2/anchor-topology-mutation.txt
  - id: native
    run: [python, ../../scripts/example_ci.py, native]
    outputs:
      - case/native/anchor-topology-mutation
      - case/stages/anchor-topology-mutation/13-gate.json
