# SolidCraft model verification for anchor-topology-mutation.
id: anchor-topology-mutation
process: true
kind: model
needs:
  - forge-package
watch:
  - examples/anchor-topology-mutation/scpf/**
  - examples/anchor-topology-mutation/model.yml
  - examples/anchor-topology-mutation/verification/**
  - scripts/forge_example.py
  - scripts/model_verify_declarative.py
strategy:
  reuse: true
steps:
  - id: model_verify
    inputs:
      - examples/anchor-topology-mutation/scpf/**
      - examples/anchor-topology-mutation/model.yml
      - examples/anchor-topology-mutation/verification/**
      - scripts/forge_example.py
      - scripts/model_verify_declarative.py
      - scpf/scpf/version.py
    run: [python, ../../scripts/model_verify_declarative.py]
    outputs:
      - solidcraft.json
      - model_verify
