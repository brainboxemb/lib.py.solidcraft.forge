section: anchors
title: Explicit topology pick follows parent resize
tagline: A fixed baseline topology pick remains attached to the selected corner
description: >
  An explicit AnchorTopology identifies one baseline edge/face/corner selection and SolidCraft retains that topology when the parent dimensions change.
parameters: Board 40 × 20 × 20 mm; Marker 10 mm cube
stages:
  - Create the parameterized Board
  - Publish one named AnchorTopology selection
  - Attach the Marker through the named topology reference
concepts:
  - AnchorTopology
  - named component anchors
  - attach
  - saved-design associativity
verification:
  summary: >
    Verifies that a topology-backed named attachment remains on the intended
    parent corner when the parent dimensions change.
  proves:
    - The baseline contains the board and marker at their expected envelopes.
    - The marker is resolved through the named topology reference rather than a recomputed world coordinate.
    - Resizing the parent keeps the marker attached to the corresponding resized corner.
  saved_design: >
    The saved design enlarges the parent width and height and verifies the
    resulting parameters plus the marker's new associative placement.
