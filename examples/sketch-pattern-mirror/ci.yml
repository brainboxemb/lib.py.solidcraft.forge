# One Forge example is one CI item. The integration step writes cheap case
# evidence through command compilation; the native step resumes at replay.
id: sketch-pattern-mirror
kind: example
watch:
  - examples/sketch-pattern-mirror/**
  - scpf/scpf/**
  - qualification/case_runner.py
  - qualification/cases.py
  - qualification/native_cases.py
  - qualification/native_validation.py
  - qualification/visual_validation.py
  - scripts/example_ci.py
strategy:
  reuse: true
steps:
  - id: integration
    run: [python, ../../scripts/example_ci.py, integration]
    outputs:
      - case/sketch-pattern-mirror.json
      - case/stages/sketch-pattern-mirror/01-q1.json
      - case/stages/sketch-pattern-mirror/02-q2.json
      - case/stages/sketch-pattern-mirror/03-compile.json
      - case/qualification/case-evidence/q1/sketch-pattern-mirror.txt
      - case/qualification/case-evidence/q2/sketch-pattern-mirror.txt
  - id: native
    run: [python, ../../scripts/example_ci.py, native]
    outputs:
      - case/native/sketch-pattern-mirror
      - case/stages/sketch-pattern-mirror/13-gate.json
