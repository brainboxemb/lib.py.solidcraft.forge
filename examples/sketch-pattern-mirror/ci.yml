# SolidCraft model verification for sketch-pattern-mirror.
id: sketch-pattern-mirror
kind: model
needs:
  - forge-tool
watch:
  - examples/sketch-pattern-mirror/scpf/**
  - examples/sketch-pattern-mirror/model.yml
  - examples/sketch-pattern-mirror/verification/**
  - scripts/forge_example.py
  - scripts/model_verify.py
  - scripts/solidcraft_runtime.py
  - docker/solidcraft_runtime/**
strategy:
  reuse: true
steps:
  - id: model_verify
    inputs:
      - examples/sketch-pattern-mirror/scpf/**
      - examples/sketch-pattern-mirror/model.yml
      - examples/sketch-pattern-mirror/verification/**
      - scripts/forge_example.py
      - scripts/model_verify.py
      - scripts/solidcraft_runtime.py
      - docker/solidcraft_runtime/**
      - scpf/scpf/version.py
    run: [python, ../../scripts/model_verify.py]
    outputs:
      - solidcraft.json
      - model_verify
