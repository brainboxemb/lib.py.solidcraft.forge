# SolidCraft model verification for round-top-sketch.
id: round-top-sketch
process: false
kind: model
needs:
  - forge-tool
watch:
  - examples/round-top-sketch/scpf/**
  - examples/round-top-sketch/model.yml
  - examples/round-top-sketch/verification/**
  - scripts/forge_example.py
  - scripts/model_verify.py
strategy:
  reuse: true
steps:
  - id: model_verify
    inputs:
      - examples/round-top-sketch/scpf/**
      - examples/round-top-sketch/model.yml
      - examples/round-top-sketch/verification/**
      - scripts/forge_example.py
      - scripts/model_verify.py
      - scpf/scpf/version.py
    run: [python, ../../scripts/model_verify.py]
    outputs:
      - solidcraft.json
      - model_verify
