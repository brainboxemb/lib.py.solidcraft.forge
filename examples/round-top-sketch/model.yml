section: fundamentals
title: TOP Sketch on circular body
tagline: A face-attached sketch resolves the largest +Z face of round geometry
description: >
  A circular base extrusion receives a second explicit Sketch on its TOP face and joins a smaller circular hub without rectangular-body metadata.
parameters: Ø100 × 10 mm disc; Ø44 × 16 mm hub
stages:
  - Sketch and extrude the circular Disc
  - Resolve the Disc TOP face
  - Sketch and join the smaller Hub from that face
concepts:
  - circular Sketch
  - face-attached Sketch
  - Anchor.TOP
  - joined extrusion
verification:
  summary: >
    Verifies TOP-face sketch placement on round geometry without relying on
    rectangular-body metadata.
  proves:
    - Disc and joined hub form one body with the expected overall envelope and volume.
    - Both circular sketches remain solved.
    - Native history preserves the Disc extrusion followed by the TOP-attached Hub extrusion.
