# Host-side verification for one Forge example.
id: group-hierarchy
kind: example
needs:
  - forge-tool
watch:
  - examples/group-hierarchy/**
  - scripts/tool_verify.py
strategy:
  reuse: true
steps:
  - id: tool_verify
    inputs:
      - examples/group-hierarchy/**
      - scripts/tool_verify.py
    run: [python, ../../scripts/tool_verify.py]
    outputs:
      - solidcraft.json
