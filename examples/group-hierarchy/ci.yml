# One Forge example is one CI item. The integration step writes cheap case
# evidence through command compilation; the native step resumes at replay.
id: group-hierarchy
kind: example
watch:
  - examples/group-hierarchy/**
  - scpf/scpf/**
  - qualification/case_runner.py
  - qualification/cases.py
  - qualification/native_cases.py
  - qualification/native_validation.py
  - qualification/visual_validation.py
  - scripts/example_ci.py
strategy:
  reuse: true
steps:
  - id: integration
    run: [python, ../../scripts/example_ci.py, integration]
    outputs:
      - case/group-hierarchy.json
      - case/stages/group-hierarchy/01-q1.json
      - case/stages/group-hierarchy/02-q2.json
      - case/stages/group-hierarchy/03-compile.json
      - case/qualification/case-evidence/q1/group-hierarchy.txt
      - case/qualification/case-evidence/q2/group-hierarchy.txt
  - id: native
    run: [python, ../../scripts/example_ci.py, native]
    outputs:
      - case/native/group-hierarchy
      - case/stages/group-hierarchy/13-gate.json
