section: components
title: Named native group hierarchy
tagline: A grouped pair of Panels remains a real nested SolidCraft component
description: >
  Two shared Panel occurrences are grouped under PanelGroup while a separate Frame remains a direct root component.
parameters: Two 10 × 2 × 20 mm Panels; one 35 × 10 × 40 mm Frame
stages:
  - Create two occurrences of one Panel definition
  - Group both Panel occurrences below PanelGroup
  - Keep Frame as a separate root-level component
concepts:
  - Assembly.group
  - component hierarchy
  - occurrence reuse
  - native BOM inspection
verification:
  summary: >
    Verifies that grouping creates a real nested native component hierarchy
    rather than only presentation metadata.
  proves:
    - The model contains the two Panel occurrences and the independent Frame body.
    - Top-level and flat BOM inspections report the intended component counts.
    - The grouped Panel occurrences preserve their native grounded/occurrence state.
