# SolidCraft model verification for xz-anchor.
id: xz-anchor
process: true
kind: model
needs:
  - forge-package
  - cad-verification-package
watch:
  - examples/xz-anchor/scpf/**
  - examples/xz-anchor/model.yml
  - examples/xz-anchor/verification/**
  - examples/xz-anchor/tests/**
  - scripts/forge_example.py
  - scripts/model_contract_test.py
  - scripts/model_verify_declarative.py
  - scripts/model_visual.py
strategy:
  reuse: true
steps:
  - id: contract_test
    inputs:
      - examples/xz-anchor/scpf/**
      - examples/xz-anchor/tests/**
      - scripts/forge_example.py
      - scripts/model_contract_test.py
    run: [python, ../../scripts/model_contract_test.py]
  - id: model_verify
    inputs:
      - examples/xz-anchor/scpf/**
      - examples/xz-anchor/model.yml
      - examples/xz-anchor/verification/**
      - examples/xz-anchor/tests/**
      - scripts/forge_example.py
      - scripts/model_verify_declarative.py
      - scripts/model_visual.py
      - scpf/scpf/version.py
    run: [python, ../../scripts/model_verify_declarative.py]
    outputs:
      - solidcraft.json
      - model_verify
