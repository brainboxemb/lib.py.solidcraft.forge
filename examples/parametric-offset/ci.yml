# SolidCraft model verification for parametric-offset.
id: parametric-offset
kind: model
needs:
  - forge-tool
watch:
  - examples/parametric-offset/scpf/**
  - examples/parametric-offset/model.yml
  - examples/parametric-offset/verification/**
  - scripts/forge_example.py
  - scripts/model_verify.py
strategy:
  reuse: true
steps:
  - id: model_verify
    inputs:
      - examples/parametric-offset/scpf/**
      - examples/parametric-offset/model.yml
      - examples/parametric-offset/verification/**
      - scripts/forge_example.py
      - scripts/model_verify.py
      - scpf/scpf/version.py
    run: [python, ../../scripts/model_verify.py]
    outputs:
      - solidcraft.json
      - model_verify
