# Host-side verification for one Forge example.
id: rotated-copy-placement
kind: example
needs:
  - forge-tool
watch:
  - examples/rotated-copy-placement/**
  - qualification/**/*.py
  - qualification/commands/**
  - scripts/tool_verify.py
strategy:
  reuse: true
steps:
  - id: tool_verify
    inputs:
      - examples/rotated-copy-placement/**
      - qualification/**/*.py
      - qualification/commands/**
      - scripts/tool_verify.py
    run: [python, ../../scripts/tool_verify.py]
    outputs:
      - solidcraft.json
