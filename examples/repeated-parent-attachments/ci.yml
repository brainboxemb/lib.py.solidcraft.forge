# SolidCraft model verification for repeated-parent-attachments.
id: repeated-parent-attachments
process: false
kind: model
needs:
  - forge-package
watch:
  - examples/repeated-parent-attachments/scpf/**
  - examples/repeated-parent-attachments/model.yml
  - examples/repeated-parent-attachments/verification/**
  - scripts/forge_example.py
  - scripts/model_verify.py
strategy:
  reuse: true
steps:
  - id: model_verify
    inputs:
      - examples/repeated-parent-attachments/scpf/**
      - examples/repeated-parent-attachments/model.yml
      - examples/repeated-parent-attachments/verification/**
      - scripts/forge_example.py
      - scripts/model_verify.py
      - scpf/scpf/version.py
    run: [python, ../../scripts/model_verify.py]
    outputs:
      - solidcraft.json
      - model_verify
