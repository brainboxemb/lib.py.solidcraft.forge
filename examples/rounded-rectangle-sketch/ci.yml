# One Forge example is one CI item. The integration step writes the cheap
# case evidence; the native step resumes the same staged output at compile.
id: rounded-rectangle-sketch
kind: example
watch:
  - examples/rounded-rectangle-sketch/**
  - scpf/scpf/**
  - qualification/case_runner.py
  - qualification/cases.py
  - qualification/native_cases.py
  - qualification/native_validation.py
  - qualification/visual_validation.py
  - scripts/example_ci.py
strategy:
  reuse: true
steps:
  - id: integration
    run: [python, ../../scripts/example_ci.py, integration]
    outputs:
      - case/stages/rounded-rectangle-sketch/01-q1.json
      - case/stages/rounded-rectangle-sketch/02-q2.json
      - case/qualification/case-evidence/q1/rounded-rectangle-sketch.txt
      - case/qualification/case-evidence/q2/rounded-rectangle-sketch.txt
  - id: native
    run: [python, ../../scripts/example_ci.py, native]
    outputs:
      - case/native/rounded-rectangle-sketch
      - case/stages/rounded-rectangle-sketch/13-gate.json
