# One Forge example is one CI item. The integration step writes cheap case
# evidence through command compilation; the native step resumes at replay.
id: sheet-fold
kind: example
watch:
  - examples/sheet-fold/**
  - scpf/scpf/**
  - qualification/case_runner.py
  - qualification/cases.py
  - qualification/native_cases.py
  - qualification/native_validation.py
  - qualification/visual_validation.py
  - scripts/example_ci.py
strategy:
  reuse: true
steps:
  - id: integration
    run: [python, ../../scripts/example_ci.py, integration]
    outputs:
      - case/sheet-fold.json
      - case/stages/sheet-fold/01-q1.json
      - case/stages/sheet-fold/02-q2.json
      - case/stages/sheet-fold/03-compile.json
      - case/qualification/case-evidence/q1/sheet-fold.txt
      - case/qualification/case-evidence/q2/sheet-fold.txt
  - id: native
    run: [python, ../../scripts/example_ci.py, native]
    outputs:
      - case/native/sheet-fold
      - case/stages/sheet-fold/13-gate.json
