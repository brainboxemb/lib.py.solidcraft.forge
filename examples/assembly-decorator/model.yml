section: components
title: Imported @assembly subassembly
tagline: An imported assembly returns reusable native component occurrences
description: >
  An imported PostPair assembly creates two occurrences of one Post definition without adding an extra geometry layer.
parameters: Two 10 × 10 × 20 mm posts centered at X=-15 mm and X=15 mm
stages:
  - Import the reusable PostPair assembly
  - Create one native Post component definition
  - Place the second Post as a translated occurrence copy
concepts:
  - assembly
  - reusable component
  - occurrence copy
  - imported subassembly
verification:
  summary: >
    Verifies that an imported assembly produces two occurrences of one reusable
    post definition at the intended placements.
  proves:
    - The native result contains exactly two post bodies.
    - Both post envelopes match the expected left and right occurrence positions.
