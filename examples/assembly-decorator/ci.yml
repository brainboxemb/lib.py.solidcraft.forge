# SolidCraft model verification for assembly-decorator.
id: assembly-decorator
kind: model
needs:
  - forge-tool
  - verification-library
watch:
  - examples/assembly-decorator/scpf/**
  - examples/assembly-decorator/model.yml
  - examples/assembly-decorator/verification/**
  - scripts/forge_example.py
  - scripts/model_verify.py
  - scripts/solidcraft_runtime.py
  - docker/solidcraft_runtime/**
strategy:
  reuse: true
steps:
  - id: model_verify
    inputs:
      - examples/assembly-decorator/scpf/**
      - examples/assembly-decorator/model.yml
      - examples/assembly-decorator/verification/**
      - scripts/forge_example.py
      - scripts/model_verify.py
      - scripts/solidcraft_runtime.py
      - docker/solidcraft_runtime/**
      - scpf/scpf/version.py
    run: [python, ../../scripts/model_verify.py]
    outputs:
      - solidcraft.json
      - model_verify
