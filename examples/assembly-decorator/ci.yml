# One Forge example is one CI item. The integration step writes the cheap
# case evidence; the native step resumes the same staged output at compile.
id: assembly-decorator
kind: example
watch:
  - examples/assembly-decorator/**
  - scpf/scpf/**
  - qualification/case_runner.py
  - qualification/cases.py
  - qualification/native_cases.py
  - qualification/native_validation.py
  - qualification/visual_validation.py
  - scripts/example_ci.py
strategy:
  reuse: true
steps:
  - id: integration
    run: [python, ../../scripts/example_ci.py, integration]
    outputs:
      - case/stages/assembly-decorator/01-q1.json
      - case/stages/assembly-decorator/02-q2.json
      - case/qualification/case-evidence/q1/assembly-decorator.txt
      - case/qualification/case-evidence/q2/assembly-decorator.txt
  - id: native
    run: [python, ../../scripts/example_ci.py, native]
    outputs:
      - case/native/assembly-decorator
      - case/stages/assembly-decorator/13-gate.json
