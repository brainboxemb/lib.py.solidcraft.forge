# Host-side verification for one Forge example.
id: circle-negative-extrude
kind: example
needs:
  - forge-tool
watch:
  - examples/circle-negative-extrude/**
  - qualification/**/*.py
  - qualification/commands/**
  - scripts/tool_verify.py
strategy:
  reuse: true
steps:
  - id: tool_verify
    inputs:
      - examples/circle-negative-extrude/**
      - qualification/**/*.py
      - qualification/commands/**
      - scripts/tool_verify.py
    run: [python, ../../scripts/tool_verify.py]
    outputs:
      - solidcraft.json
