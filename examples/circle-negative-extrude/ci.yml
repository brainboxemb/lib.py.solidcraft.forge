# One Forge example is one CI item. The integration step writes the cheap
# case evidence; the native step resumes the same staged output at compile.
id: circle-negative-extrude
kind: example
watch:
  - examples/circle-negative-extrude/**
  - scpf/scpf/**
  - qualification/case_runner.py
  - qualification/cases.py
  - qualification/native_cases.py
  - qualification/native_validation.py
  - qualification/visual_validation.py
  - scripts/example_ci.py
strategy:
  reuse: true
steps:
  - id: integration
    run: [python, ../../scripts/example_ci.py, integration]
    outputs:
      - case/stages/circle-negative-extrude/01-q1.json
      - case/stages/circle-negative-extrude/02-q2.json
      - case/qualification/case-evidence/q1/circle-negative-extrude.txt
      - case/qualification/case-evidence/q2/circle-negative-extrude.txt
  - id: native
    run: [python, ../../scripts/example_ci.py, native]
    outputs:
      - case/native/circle-negative-extrude
      - case/stages/circle-negative-extrude/13-gate.json
