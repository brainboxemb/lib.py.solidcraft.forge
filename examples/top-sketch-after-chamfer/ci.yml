# SolidCraft model verification for top-sketch-after-chamfer.
id: top-sketch-after-chamfer
process: false
kind: model
needs:
  - forge-tool
watch:
  - examples/top-sketch-after-chamfer/scpf/**
  - examples/top-sketch-after-chamfer/model.yml
  - examples/top-sketch-after-chamfer/verification/**
  - scripts/forge_example.py
  - scripts/model_verify.py
strategy:
  reuse: true
steps:
  - id: model_verify
    inputs:
      - examples/top-sketch-after-chamfer/scpf/**
      - examples/top-sketch-after-chamfer/model.yml
      - examples/top-sketch-after-chamfer/verification/**
      - scripts/forge_example.py
      - scripts/model_verify.py
      - scpf/scpf/version.py
    run: [python, ../../scripts/model_verify.py]
    outputs:
      - solidcraft.json
      - model_verify
