# Host-side verification for one Forge example.
id: top-sketch-after-chamfer
kind: example
needs:
  - forge-tool
watch:
  - examples/top-sketch-after-chamfer/**
  - scripts/tool_verify.py
strategy:
  reuse: true
steps:
  - id: tool_verify
    inputs:
      - examples/top-sketch-after-chamfer/**
      - scripts/tool_verify.py
    run: [python, ../../scripts/tool_verify.py]
    outputs:
      - solidcraft.json
