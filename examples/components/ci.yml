# Host-side verification for one Forge example.
id: components
kind: example
needs:
  - forge-tool
watch:
  - examples/components/**
  - scripts/tool_verify.py
strategy:
  reuse: true
steps:
  - id: tool_verify
    inputs:
      - examples/components/**
      - scripts/tool_verify.py
    run: [python, ../../scripts/tool_verify.py]
    outputs:
      - solidcraft.json
