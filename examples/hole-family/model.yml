section: features
title: Native Hole family
tagline: Four native mechanical hole intents on one plate
description: >
  A single plate exercising simple, counterbore, countersink and threaded holes as direct native SolidCraft Hole features.
parameters: 120 × 40 × 12 mm plate; Ø6 simple, Ø6/Ø12 counterbore, Ø6/Ø12 90° countersink, M6 threaded hole
stages:
  - Create one bottom-anchored native Box plate
  - Add simple, counterbore and countersink Hole features
  - Add one modeled M6 threaded Hole feature
concepts:
  - Hole
  - CounterboreHole
  - CountersinkHole
  - ThreadedHole
  - native feature history
verification:
  summary: >
    Verifies the four supported native Hole-family intents on one plate without
    introducing helper sketches.
  proves:
    - The plate remains one body with the expected outer envelope.
    - Native history contains exactly four HoleFeature entries.
    - The model contains no sketch objects for these direct native hole features.
