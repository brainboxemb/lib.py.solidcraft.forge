# One Forge example is one CI item. The integration step writes the cheap
# case evidence; the native step resumes the same staged output at compile.
id: eight-corner-brackets
kind: example
watch:
  - examples/eight-corner-brackets/**
  - scpf/scpf/**
  - qualification/case_runner.py
  - qualification/cases.py
  - qualification/native_cases.py
  - qualification/native_validation.py
  - qualification/visual_validation.py
  - scripts/example_ci.py
strategy:
  reuse: true
steps:
  - id: integration
    run: [python, ../../scripts/example_ci.py, integration]
    outputs:
      - case/stages/eight-corner-brackets/01-q1.json
      - case/stages/eight-corner-brackets/02-q2.json
      - case/qualification/case-evidence/q1/eight-corner-brackets.txt
      - case/qualification/case-evidence/q2/eight-corner-brackets.txt
  - id: native
    run: [python, ../../scripts/example_ci.py, native]
    outputs:
      - case/native/eight-corner-brackets
      - case/stages/eight-corner-brackets/13-gate.json
