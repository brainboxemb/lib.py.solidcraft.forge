section: components
title: "Eight vertical L-profiles: two per side corner"
tagline: One reusable L-profile is placed at top and bottom of each frame corner
description: >
  A parametric frame reuses one L-profile component in eight calculated placements, two on every rounded side corner.
parameters: Frame 120 × 80 × 60 mm; L-profile arm 28 mm, thickness 4 mm, height 16 mm
stages:
  - Create the parameterized FrameBlock
  - Create one reusable LProfile definition
  - Place eight calculated top and bottom corner occurrences
concepts:
  - reusable component
  - occurrence copies
  - Placement
  - rotation
  - parametric assembly
verification:
  summary: >
    Verifies eight placements of one reusable L-profile around a parameterized
    frame, including top/bottom positions and corner rotations.
  proves:
    - The result contains the frame plus eight bracket bodies.
    - Every bracket envelope matches its intended corner and height.
    - Resizing the frame recalculates all eight occurrence placements.
  saved_design: >
    The saved design changes frame width, depth and height and verifies all
    eight brackets at the corresponding resized corner locations.
