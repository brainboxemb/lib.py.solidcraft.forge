# SolidCraft model verification for eight-flightcase-corners.
id: eight-flightcase-corners
kind: model
needs:
  - forge-tool
  - verification-library
watch:
  - examples/eight-flightcase-corners/scpf/**
  - examples/eight-flightcase-corners/model.yml
  - examples/eight-flightcase-corners/verification/**
  - scripts/forge_example.py
  - scripts/model_verify.py
  - scripts/solidcraft_runtime.py
  - docker/solidcraft_runtime/**
strategy:
  reuse: true
steps:
  - id: model_verify
    inputs:
      - examples/eight-flightcase-corners/scpf/**
      - examples/eight-flightcase-corners/model.yml
      - examples/eight-flightcase-corners/verification/**
      - scripts/forge_example.py
      - scripts/model_verify.py
      - scripts/solidcraft_runtime.py
      - docker/solidcraft_runtime/**
      - scpf/scpf/version.py
    run: [python, ../../scripts/model_verify.py]
    outputs:
      - solidcraft.json
      - model_verify
