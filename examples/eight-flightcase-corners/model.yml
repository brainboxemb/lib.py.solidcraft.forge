section: components
title: Eight flightcase corner protectors
tagline: One neutral trihedral protector is reused on all eight case corners
description: >
  A parameterized case reuses one three-plate corner protector with assembly-owned positions and 3D orientations.
parameters: Case 120 × 80 × 60 mm; protector envelope 24 × 24 × 24 mm
stages:
  - Create the parameterized CaseBlock
  - Create one reusable FlightcaseCorner definition
  - Place and orient eight protector occurrences
concepts:
  - reusable component
  - 3D occurrence orientation
  - Placement
  - parametric assembly
verification:
  summary: >
    Verifies one neutral three-plate protector reused with eight distinct
    placements and orientations around a parameterized case.
  proves:
    - The result contains one case body and eight protector bodies.
    - The protector group occupies all eight expected corner envelopes.
    - Resizing the case moves every protector while preserving the reusable protector definition.
  saved_design: >
    The saved design changes all three case dimensions and verifies the eight
    protector placements against the resized case.
