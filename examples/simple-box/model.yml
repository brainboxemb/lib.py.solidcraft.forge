section: fundamentals
title: Parameterized Box
tagline: Three editable dimensions driving one native box
description: >
  A minimal Forge model that exposes length, width and height as editable
  SolidCraft parameters and lowers directly to one native Box feature.
parameters: 40 × 30 × 10 mm; editable length, width and height
stages:
  - Define editable length, width and height
  - Create one bottom-anchored Box
  - Lower directly to a native SolidCraft Box feature
concepts:
  - Box
  - editable parameters
  - Anchor.BOTTOM
  - native primitive
verification:
  summary: >
    Verifies the smallest Forge-to-SolidCraft path: three editable parameters
    driving one native bottom-anchored Box feature.
  proves:
    - The baseline contains exactly one body with the expected box envelope.
    - Length, width and height are published as editable native parameters.
    - Native history contains one Box feature.
  saved_design: >
    The saved design changes only the length parameter and verifies that the
    native box rebuilds to the new length while width and height remain unchanged.
