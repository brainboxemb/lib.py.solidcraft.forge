# One Forge example is one CI item. Integration writes cheap case evidence
# through command compilation; native resumes the same staged output at replay.
id: simple-box
kind: example
watch:
  - examples/simple-box/scpf/**
  - examples/simple-box/tests/**
  - scpf/scpf/**
  - qualification/case_runner.py
  - qualification/case_evidence.py
  - qualification/case_selection.py
  - qualification/cases.py
  - qualification/camera.py
  - qualification/goal_overlay.py
  - qualification/native_cases.py
  - qualification/native_validation.py
  - qualification/run_case_evidence.py
  - qualification/run_post_build_inspections.py
  - qualification/visual_validation.py
  - qualification/commands/**
  - qualification/finalize_item_result.py
  - qualification/collect_item_results.py
  - qualification/results.py
  - qualification/project_metadata.py
  - scripts/example_ci.py
strategy:
  reuse: true
steps:
  - id: integration
    run: [python, ../../scripts/example_ci.py, integration]
    outputs:
      - case/simple-box.json
      - case/stages/simple-box/01-q1.json
      - case/stages/simple-box/02-q2.json
      - case/stages/simple-box/03-compile.json
      - case/qualification/case-evidence/q1/simple-box.txt
      - case/qualification/case-evidence/q2/simple-box.txt
  - id: native
    run: [python, ../../scripts/example_ci.py, native]
    outputs:
      - case/native/simple-box
      - case/stages/simple-box/13-gate.json
