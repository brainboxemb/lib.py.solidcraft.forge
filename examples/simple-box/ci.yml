# SolidCraft model verification for the first migrated historical model.
id: simple-box
kind: model
needs:
  - forge-tool
watch:
  - examples/simple-box/scpf/**
  - examples/simple-box/model.yml
  - examples/simple-box/verification/**
  - scripts/forge_example.py
  - scripts/model_verify.py
  - scripts/solidcraft_runtime.py
  - docker/solidcraft_runtime/**
strategy:
  reuse: true
steps:
  - id: model_verify
    inputs:
      - examples/simple-box/scpf/**
      - examples/simple-box/model.yml
      - examples/simple-box/verification/**
      - scripts/forge_example.py
      - scripts/model_verify.py
      - scripts/solidcraft_runtime.py
      - docker/solidcraft_runtime/**
      - scpf/scpf/version.py
    run: [python, ../../scripts/model_verify.py]
    outputs:
      - solidcraft.json
      - model_verify
