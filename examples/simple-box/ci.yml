# First migrated Forge example: host-side contract verification only.
id: simple-box
kind: example
needs:
  - forge-tool
watch:
  - examples/simple-box/scpf/**
  - examples/simple-box/tests/**
  - qualification/cases.py
  - qualification/native_cases.py
  - qualification/commands/simple-box/**
  - scripts/tool_verify.py
strategy:
  reuse: true
steps:
  - id: tool_verify
    inputs:
      - examples/simple-box/scpf/**
      - examples/simple-box/tests/**
      - qualification/cases.py
      - qualification/native_cases.py
      - qualification/commands/simple-box/**
      - scripts/tool_verify.py
    run: [python, ../../scripts/tool_verify.py]
    outputs:
      - solidcraft.json
