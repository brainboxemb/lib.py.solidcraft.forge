# Forge command-contract verification plus one SolidCraft model verification.
id: simple-box
kind: example
needs:
  - forge-tool
watch:
  - examples/simple-box/**
  - scripts/tool_verify.py
  - scripts/model_verify.py
  - scripts/solidcraft_runtime.py
  - docker/solidcraft_runtime/**
strategy:
  reuse: true
steps:
  - id: tool_verify
    inputs:
      - examples/simple-box/scpf/**
      - examples/simple-box/tests/**
      - scripts/tool_verify.py
    run: [python, ../../scripts/tool_verify.py]
    outputs:
      - solidcraft.json

  - id: model_verify
    inputs:
      - examples/simple-box/model.yml
      - examples/simple-box/verification/**
      - scripts/model_verify.py
      - scripts/solidcraft_runtime.py
      - docker/solidcraft_runtime/**
      - scpf/scpf/version.py
    run: [python, ../../scripts/model_verify.py]
    outputs:
      - model_verify
