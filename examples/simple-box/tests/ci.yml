# The integration tests own the generated-command contract for simple-box.
# Native SolidCraft execution belongs to the parent case item.
id: integration-simple-box
kind: integration
watch:
  - examples/simple-box/tests/**
  - examples/simple-box/scpf/**
  - scpf/scpf/**
  - qualification/cases.py
  - qualification/native_cases.py
strategy:
  reuse: true
steps:
  - id: test
    run: [python, -m, unittest, discover, -s, ., -p, "test_*.py", -v]
