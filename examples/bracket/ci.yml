# SolidCraft model verification for bracket.
id: bracket
process: false
kind: model
needs:
  - forge-package
watch:
  - examples/bracket/scpf/**
  - examples/bracket/model.yml
  - examples/bracket/verification/**
  - scripts/forge_example.py
  - scripts/model_verify.py
strategy:
  reuse: true
steps:
  - id: model_verify
    inputs:
      - examples/bracket/scpf/**
      - examples/bracket/model.yml
      - examples/bracket/verification/**
      - scripts/forge_example.py
      - scripts/model_verify.py
      - scpf/scpf/version.py
    run: [python, ../../scripts/model_verify.py]
    outputs:
      - solidcraft.json
      - model_verify
