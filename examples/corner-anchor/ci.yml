# One Forge example is one CI item. tool_verify proves the generated
# SolidCraft command contract; model_verify executes and checks the CAD model.
id: corner-anchor
kind: example
watch:
  - examples/corner-anchor/scpf/**
  - examples/corner-anchor/tests/**
  - scpf/scpf/**
  - qualification/case_runner.py
  - qualification/case_selection.py
  - qualification/cases.py
  - qualification/camera.py
  - qualification/goal_overlay.py
  - qualification/native_cases.py
  - qualification/native_validation.py
  - qualification/run_post_build_inspections.py
  - qualification/visual_validation.py
  - qualification/commands/**
  - qualification/finalize_item_result.py
  - qualification/collect_item_results.py
  - qualification/results.py
  - qualification/project_metadata.py
  - scripts/example_ci.py
strategy:
  reuse: true
steps:
  - id: tool_verify
    run: [python, ../../scripts/example_ci.py, tool_verify]
    outputs:
      - case/corner-anchor.json
      - case/stages/corner-anchor/01-compile.json
  - id: model_verify
    run: [python, ../../scripts/example_ci.py, model_verify]
    outputs:
      - case/model_verify/corner-anchor
      - case/stages/corner-anchor/11-result.json
