# One Forge example is one CI item. The integration step writes cheap case
# evidence through command compilation; the native step resumes at replay.
id: corner-anchor
kind: example
watch:
  - examples/corner-anchor/**
  - scpf/scpf/**
  - qualification/case_runner.py
  - qualification/cases.py
  - qualification/native_cases.py
  - qualification/native_validation.py
  - qualification/visual_validation.py
  - scripts/example_ci.py
strategy:
  reuse: true
steps:
  - id: integration
    run: [python, ../../scripts/example_ci.py, integration]
    outputs:
      - case/corner-anchor.json
      - case/stages/corner-anchor/01-q1.json
      - case/stages/corner-anchor/02-q2.json
      - case/stages/corner-anchor/03-compile.json
      - case/qualification/case-evidence/q1/corner-anchor.txt
      - case/qualification/case-evidence/q2/corner-anchor.txt
  - id: native
    run: [python, ../../scripts/example_ci.py, native]
    outputs:
      - case/native/corner-anchor
      - case/stages/corner-anchor/13-gate.json
