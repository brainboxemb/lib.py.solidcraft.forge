section: anchors
title: Topology-backed corner anchor
tagline: A standard corner reference follows parent width and height
description: >
  A Marker uses matching parent and child corner anchors so the native relationship follows two changing parent dimensions.
parameters: Base 40 × 30 × 20 mm; Marker 10 mm cube
stages:
  - Create the parameterized Base
  - Attach Marker with FRONT_TOP_RIGHT to BACK_TOP_RIGHT
  - Preserve the corner relationship through parent resize
concepts:
  - Anchor
  - corner attachment
  - attach
  - saved-design associativity
verification:
  summary: >
    Verifies a standard corner-to-corner attachment that remains associative
    when the parent width and height change.
  proves:
    - Base and marker occupy the expected baseline envelopes.
    - The marker is positioned through the corner relationship rather than a fixed world coordinate.
    - Parent resize moves the marker to the corresponding resized corner.
  saved_design: >
    The saved design enlarges the parent and verifies the marker's new
    topology-backed corner placement.
