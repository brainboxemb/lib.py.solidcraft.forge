section: components
title: Four centred vertical L-profiles
tagline: One L-profile definition is placed around all four frame corners
description: >
  A parametric frame reuses one short L-profile component at each side corner with assembly-calculated positions and rotations.
parameters: Frame 120 × 80 × 60 mm; L-profile arm 28 mm, thickness 4 mm, height 16 mm
stages:
  - Create the parameterized FrameBlock
  - Create one reusable LProfile definition
  - Place four rotated occurrences around the frame corners
concepts:
  - reusable component
  - occurrence copy
  - Placement
  - rotation
  - parametric assembly
verification:
  summary: >
    Verifies four rotated placements of one reusable L-profile around the side
    corners of a parameterized frame.
  proves:
    - The frame and four L-profile bodies occupy the intended baseline envelopes.
    - Each occurrence keeps the correct corner rotation and centred height.
    - Resizing the frame recalculates the four corner placements.
  saved_design: >
    The saved design changes frame width and depth and verifies all four bracket
    occurrences against the resized frame.
