# SolidCraft model verification for four-corner-l.
id: four-corner-l
process: true
kind: model
needs:
  - forge-tool
watch:
  - examples/four-corner-l/scpf/**
  - examples/four-corner-l/model.yml
  - examples/four-corner-l/verification/**
  - scripts/forge_example.py
  - scripts/model_verify_declarative.py
strategy:
  reuse: true
steps:
  - id: model_verify
    inputs:
      - examples/four-corner-l/scpf/**
      - examples/four-corner-l/model.yml
      - examples/four-corner-l/verification/**
      - scripts/forge_example.py
      - scripts/model_verify_declarative.py
      - scpf/scpf/version.py
    run: [python, ../../scripts/model_verify_declarative.py]
    outputs:
      - solidcraft.json
      - model_verify
