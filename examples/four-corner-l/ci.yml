# SolidCraft model verification for four-corner-l.
id: four-corner-l
process: true
kind: model
needs:
  - forge-package
  - model-verification-batch
watch:
  - examples/four-corner-l/scpf/**
  - examples/four-corner-l/model.yml
  - examples/four-corner-l/verification/**
  - examples/four-corner-l/tests/**
  - scripts/forge_example.py
  - scripts/model_contract_test.py
  - scripts/model_verification_batch.py
strategy:
  reuse: true
steps:
  - id: contract_test
    inputs:
      - examples/four-corner-l/scpf/**
      - examples/four-corner-l/tests/**
      - scripts/forge_example.py
      - scripts/model_contract_test.py
    run: [python, ../../scripts/model_contract_test.py]
  - id: model_verify
    inputs:
      - examples/four-corner-l/scpf/**
      - examples/four-corner-l/model.yml
      - examples/four-corner-l/verification/**
      - examples/four-corner-l/tests/**
      - scripts/forge_example.py
      - scripts/model_verification_batch.py
    run: [python, ../../scripts/model_verification_batch.py, materialize]
    outputs:
      - solidcraft.json
      - model_verify
