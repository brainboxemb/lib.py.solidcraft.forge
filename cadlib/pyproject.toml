[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scpf"
version = "0.22.1"
description = "Python scripting interface for the SolidCraft CAD engine"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["scpf*"]
