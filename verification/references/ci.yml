# Transitional aggregate for active models not yet migrated to child reference items.
id: reference-verification
kind: verification
watch:
  - examples/xz-anchor/verification/reference_geometry.json
  - examples/xz-anchor/pythonscad/**
  - examples/xz-anchor/pybosl2/**
  - examples/xz-anchor/cadquery/**
  - examples/xz-anchor/build123d/**
  - verification/reference_validation.py
  - verification/build123d_export.py
  - scripts/verification_evidence.py
strategy:
  reuse: true
steps:
  - id: verify_references
    inputs:
      - examples/xz-anchor/verification/reference_geometry.json
      - examples/xz-anchor/pythonscad/**
      - examples/xz-anchor/pybosl2/**
      - examples/xz-anchor/cadquery/**
      - examples/xz-anchor/build123d/**
      - verification/reference_validation.py
      - verification/build123d_export.py
      - scripts/verification_evidence.py
    run:
      - python
      - ../../scripts/verification_evidence.py
      - verify_references
      - xz-anchor
    outputs:
      - references
