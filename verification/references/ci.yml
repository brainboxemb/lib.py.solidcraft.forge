# Independent reference verification for current Forge model items.
id: reference-verification
kind: verification
watch:
  - examples/*/ci.yml
  - examples/*/verification/reference_geometry.json
  - examples/*/pythonscad/**
  - examples/*/pybosl2/**
  - examples/*/cadquery/**
  - examples/*/build123d/**
  - verification/reference_validation.py
  - verification/build123d_export.py
  - scripts/verification_evidence.py
  - scripts/solidcraft_runtime.py
  - docker/solidcraft_runtime/**
strategy:
  reuse: true
steps:
  - id: verify_references
    inputs:
      - examples/simple-box/verification/reference_geometry.json
      - examples/simple-box/pythonscad/**
      - examples/simple-box/pybosl2/**
      - examples/simple-box/cadquery/**
      - examples/simple-box/build123d/**
      - verification/reference_validation.py
      - verification/build123d_export.py
      - scripts/verification_evidence.py
      - scripts/solidcraft_runtime.py
      - docker/solidcraft_runtime/**
    run: [python, ../../scripts/verification_evidence.py, verify_references, simple-box]
    outputs:
      - references
