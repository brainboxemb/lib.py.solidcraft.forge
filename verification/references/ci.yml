# Independent reference verification for every current Forge model item.
id: reference-verification
kind: verification
needs:
  - verification-library
watch:
  - examples/*/verification/reference_geometry.json
  - examples/*/pythonscad/**
  - examples/*/pybosl2/**
  - examples/*/cadquery/**
  - examples/*/build123d/**
  - verification/reference_validation.py
  - verification/build123d_export.py
  - scripts/verification_evidence.py
  - scripts/solidcraft_runtime.py
  - docker/solidcraft_runtime/**
strategy:
  reuse: true
steps:
  - id: verify_references
    inputs:
      - examples/*/verification/reference_geometry.json
      - examples/*/pythonscad/**
      - examples/*/pybosl2/**
      - examples/*/cadquery/**
      - examples/*/build123d/**
      - verification/reference_validation.py
      - verification/build123d_export.py
      - scripts/verification_evidence.py
      - scripts/solidcraft_runtime.py
      - docker/solidcraft_runtime/**
    run: [python, ../../scripts/verification_evidence.py, verify_references, all]
    outputs:
      - references
